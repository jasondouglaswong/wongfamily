<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wong Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:oklch(98.2% 0.004 85); --panel:oklch(100% 0 0); --ink:oklch(17% 0.012 40);
    --sub:oklch(43% 0.012 55); --sub2:oklch(58% 0.009 60); --border:oklch(89% 0.007 85); --border-soft:oklch(93.5% 0.005 85);
    --accent:oklch(55% 0.115 75); --accent-ink:oklch(99% 0.006 85); --accent-soft:oklch(94.3% 0.035 78);
    --accent2:oklch(55% 0.115 75);
    --uncertain:oklch(50% 0.2 26); --uncertain-soft:oklch(92% 0.055 25);
    --shadow:0 1px 2px oklch(20% 0 0 / .05);
    --shadow-lg:0 14px 34px oklch(20% 0 0 / .12), 0 2px 8px oklch(20% 0 0 / .06);
    --radius:12px;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:oklch(15.5% 0.009 50); --panel:oklch(20.5% 0.009 50); --ink:oklch(94.5% 0.006 85);
    --sub:oklch(71% 0.009 70); --sub2:oklch(55% 0.009 65); --border:oklch(30% 0.009 55); --border-soft:oklch(26% 0.008 55);
    --accent:oklch(74% 0.115 78); --accent-ink:oklch(16% 0.01 50); --accent-soft:oklch(30% 0.045 78);
    --accent2:oklch(74% 0.115 78);
    --uncertain:oklch(64% 0.21 26); --uncertain-soft:oklch(35% 0.15 25);
    --shadow:0 1px 2px oklch(0% 0 0 / .35); --shadow-lg:0 18px 40px oklch(0% 0 0 / .45);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:oklch(15.5% 0.009 50); --panel:oklch(20.5% 0.009 50); --ink:oklch(94.5% 0.006 85);
      --sub:oklch(71% 0.009 70); --sub2:oklch(55% 0.009 65); --border:oklch(30% 0.009 55); --border-soft:oklch(26% 0.008 55);
      --accent:oklch(74% 0.115 78); --accent-ink:oklch(16% 0.01 50); --accent-soft:oklch(30% 0.045 78);
      --accent2:oklch(74% 0.115 78);
      --uncertain:oklch(64% 0.21 26); --uncertain-soft:oklch(35% 0.15 25);
      --shadow:0 1px 2px oklch(0% 0 0 / .35); --shadow-lg:0 18px 40px oklch(0% 0 0 / .45);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;}
  html{margin:0;padding:0;background:var(--bg);}
  body{margin:0;padding:0 0 40px;color:var(--ink);background:var(--bg);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  /* Everything the tree needs lives inside this one box, positioned in the
     normal page flow — so dropping this file into an existing site (or an
     "embed HTML" block) never covers that site's own header/nav, and the
     page around it scrolls normally. Fixed/absolute elements below are all
     scoped to this box, never to the browser viewport. */
  #app{
    position:relative; isolation:isolate; width:100%;
    height:min(85vh, 900px); min-height:520px;
    overflow:hidden; background:var(--bg);
    border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg);
    display:flex; flex-direction:column;
  }
  #app:fullscreen{ height:100vh; border-radius:0; }

  /* toolbar/breadcrumb/stage/activityBar stack as normal flex children (not
     absolutely-positioned regions with hand-guessed pixel offsets) so a
     toolbar that wraps to 2 rows on a narrow phone simply pushes everything
     below it down, instead of overlapping it. */
  #toolbar{
    flex:none;background:color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);border-radius:16px 16px 0 0;
    display:flex;align-items:center;gap:12px;padding:12px 20px;z-index:50;flex-wrap:wrap;
  }
  .miniSeal{display:inline-flex;flex:none;align-items:center;justify-content:center;width:14px;height:14px;
    border:1px solid var(--uncertain);border-radius:3px;color:var(--uncertain);font-size:9px;line-height:1;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Songti SC",serif;}
  #seal{flex:none;width:44px;height:44px;border:1.6px solid var(--uncertain);border-radius:9px;
    display:flex;align-items:center;justify-content:center;color:var(--uncertain);margin-right:4px;}
  #seal span{font-size:24px;line-height:1;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Songti SC",serif;}
  #wordmark{flex:none;min-width:200px;font-family:'Manrope',sans-serif;font-weight:700;font-size:21px;letter-spacing:.002em;color:var(--ink);white-space:nowrap;}
  #wordmark small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--sub2);margin-top:4px;}
  .divider{width:1px;align-self:stretch;margin:14px 2px;background:var(--border);}

  #toolbar button, #toolbar input[type=text]{
    font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--border);border-radius:9px;
    background:var(--panel);cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s,transform .1s;
    display:inline-flex;align-items:center;gap:6px;
  }
  #toolbar button:hover{background:var(--accent-soft);border-color:var(--accent);}
  #toolbar button:active{transform:scale(.97);}
  #toolbar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  #toolbar button.primary:hover{filter:brightness(1.08);}
  #toolbar button.icon-btn{padding:7px 9px;}
  #searchWrap{position:relative;width:200px;}
  #search{width:100%;cursor:text;}
  #search:focus, #toolbar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  #searchResults{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);max-height:230px;overflow-y:auto;display:none;z-index:80;}
  #searchResults .res{padding:7px 11px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink);}
  #searchResults .res:hover{background:var(--accent-soft);}
  #searchResults .res .rn{flex:1;min-width:0;}
  #searchResults .res .g{color:var(--sub2);font-size:10.5px;white-space:nowrap;}
  .spacer{flex:1;}

  #breadcrumb{flex:none;height:32px;padding:0 20px;font-size:11.5px;color:var(--sub);
    display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border-soft);
    background:var(--bg);z-index:30;white-space:nowrap;overflow-x:auto;}
  #breadcrumb .crumb{cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:4px;}
  #breadcrumb .crumb:hover{color:var(--accent);}
  #breadcrumb .sep{display:flex;color:var(--sub2);opacity:.7;}
  #breadcrumb .current{color:var(--ink);font-weight:700;}
  #breadcrumb .dots{color:var(--sub2);letter-spacing:1px;}

  #stage{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;padding:30px 24px 40px;
    background:var(--bg);}

  .tierLabel{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub2);margin-bottom:10px;}
  .tierLabel svg{color:var(--accent);}
  .tier{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;position:relative;}
  .tier-anc-1 .card{opacity:.6;padding:9px 13px;}
  .tier-anc-1 .card .name{font-size:12px;}
  .tier-anc-1 .card .dates{font-size:10px;}
  .tier-anc-2 .card{opacity:.78;padding:10px 14px;}
  .tier-anc-2 .card .name{font-size:12.5px;}
  .tier-anc-3 .card{padding:11px 15px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:13px 17px;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;
    text-align:left;position:relative;display:flex;align-items:center;gap:9px;}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent);}
  .card .txt{min-width:0;}
  .card .name{font-family:'Manrope',sans-serif;font-weight:600;color:var(--ink);font-size:13.5px;white-space:nowrap;}
  .card .dates{color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:.01em;font-size:11px;margin-top:1px;}
  .card.uncertain{border-color:var(--uncertain);}
  .card.uncertain::after{content:"?";position:absolute;top:-7px;right:-7px;background:var(--uncertain);color:#fff;
    width:16px;height:16px;border-radius:50%;font-size:10px;line-height:16px;text-align:center;font-weight:700;
    box-shadow:0 0 0 2px var(--bg);}
  .child-card{background:var(--accent-soft);border-color:var(--accent);}

  #focusRow{display:flex;align-items:flex-start;gap:26px;justify-content:center;flex-wrap:wrap;width:100%;}
  #siblingsCol{display:flex;flex-direction:column;gap:7px;align-items:flex-end;padding-top:20px;max-width:160px;min-width:60px;}
  #siblingsCol .sibLabel{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--sub2);margin-bottom:2px;}
  #siblingsCol .sibLabel svg{color:var(--sub2);}
  .sib-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 5px;font-size:11.5px;
    font-weight:500;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:7px;color:var(--ink);}
  .sib-card:hover{border-color:var(--accent);color:var(--accent);}
  .sib-card.uncertain{border-color:var(--uncertain);color:var(--uncertain);}

  #focusCard{background:var(--panel);border:1.6px solid var(--ink);border-radius:16px;padding:26px 34px;
    box-shadow:var(--shadow-lg);text-align:center;min-width:250px;max-width:340px;position:relative;}
  #focusCard .name{font-family:'Manrope',sans-serif;font-weight:700;font-size:22px;color:var(--ink);line-height:1.22;}
  #focusCard .gen{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:8px;}
  #focusCard .dates{font-size:13px;color:var(--sub);margin-top:9px;font-variant-numeric:tabular-nums;}
  #focusCard .note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.55;text-align:left;
    border-top:1px solid var(--border-soft);padding-top:13px;display:flex;gap:7px;}
  #focusCard .note svg{flex:none;margin-top:2px;color:var(--sub2);}
  #focusCard .uncertainBadge{position:absolute;top:-11px;right:-11px;background:var(--uncertain);color:#fff;
    width:25px;height:25px;border-radius:50%;font-size:12.5px;font-weight:700;display:flex;align-items:center;
    justify-content:center;box-shadow:0 0 0 3px var(--bg);}
  #focusCard .cardSeal{position:absolute;bottom:11px;right:13px;width:21px;height:21px;border:1px solid var(--uncertain);
    border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--uncertain);font-size:12px;
    line-height:1;opacity:.5;transform:rotate(-6deg);pointer-events:none;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Songti SC",serif;}
  #focusCard .editBadge{position:absolute;top:-11px;left:-11px;width:25px;height:25px;border-radius:50%;
    background:var(--panel);border:1px solid var(--border);color:var(--sub);display:flex;align-items:center;
    justify-content:center;box-shadow:var(--shadow);cursor:pointer;transition:color .15s,border-color .15s;}
  #focusCard .editBadge:hover{color:var(--accent);border-color:var(--accent);}

  #spouseCards{display:flex;flex-direction:column;gap:8px;padding-top:20px;max-width:200px;}
  .spouse-card{background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:8px 13px;
    font-size:12px;color:var(--ink);display:flex;align-items:center;gap:9px;font-weight:500;}
  .spouse-card{cursor:pointer;transition:background .15s;}
  .spouse-card:hover{background:var(--accent-soft);filter:brightness(1.03);}
  .spouse-card[data-spouse-photo] .avatar{transition:transform .12s;}
  .spouse-card[data-spouse-photo] .avatar:hover{transform:scale(1.08);}
  .spouse-note{font-weight:400;color:var(--sub);font-size:11px;margin-top:2px;line-height:1.4;}

  .vline{width:1.4px;height:32px;background:var(--border);margin:2px auto;}

  #descendantsOuter{width:100%;}
  #descendantsWrap{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-start;gap:22px;
    width:100%;overflow-x:auto;padding:2px 4px 16px;}
  #descendantsWrap::-webkit-scrollbar{height:6px;}
  #descendantsWrap::-webkit-scrollbar-track{background:transparent;}
  #descendantsWrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  #descendantsWrap:hover::-webkit-scrollbar-thumb{background:var(--accent);}
  .childGroup{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
  .mini-vline{width:1.2px;height:16px;background:var(--border-soft);margin:6px auto;}
  .gkidsRow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:210px;}
  .gkid-chip{border-radius:16px;padding:4px 10px 4px 4px;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;
    border:1px solid var(--border);background:var(--uncertain-soft);color:var(--ink);display:inline-flex;align-items:center;gap:6px;position:relative;}
  .gkid-chip:hover{border-color:var(--accent);color:var(--accent);}
  .gkid-chip.uncertain{border-color:var(--uncertain);}
  .gkid-chip.uncertain::after{content:"?";position:absolute;top:-6px;right:-6px;background:var(--uncertain);color:#fff;
    width:13px;height:13px;border-radius:50%;font-size:8.5px;line-height:13px;text-align:center;font-weight:700;
    box-shadow:0 0 0 2px var(--bg);}

  #noChildren{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:500;
    color:var(--sub2);text-align:center;width:100%;font-style:normal;}

  /* a small card-like backing plate sitting just behind the portrait */
  #bigPortraitBacking{position:absolute;top:104px;right:14px;width:204px;height:256px;z-index:54;
    background:var(--panel);border-radius:18px;
    box-shadow:0 18px 36px oklch(20% 0 0 / .16),0 2px 8px oklch(20% 0 0 / .1);
    opacity:0;transform:translateY(-10px) scale(.95);pointer-events:none;
    transition:opacity .32s ease,transform .32s ease;}
  #bigPortraitBacking.show{opacity:1;transform:translateY(0) scale(1);}
  #bigPortrait{position:absolute;top:116px;right:30px;width:176px;height:224px;z-index:55;
    pointer-events:none;opacity:0;transform:translateY(-10px) scale(.95);
    transition:opacity .32s ease,transform .32s ease;background-size:cover;background-position:center center;
    -webkit-mask-image:radial-gradient(ellipse 58% 54% at 50% 46%, black 48%, transparent 88%);
    mask-image:radial-gradient(ellipse 58% 54% at 50% 46%, black 48%, transparent 88%);
    display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:700;
    font-size:52px;filter:drop-shadow(0 12px 26px oklch(20% 0 0 / .22));
    text-shadow:0 2px 4px oklch(15% 0 0 / .55),0 0 2px oklch(15% 0 0 / .4);}
  #bigPortrait.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;cursor:pointer;}
  @media (max-width:760px){ #bigPortrait{display:none;} #bigPortraitBacking{display:none;} }

  /* Activity log -- a permanent strip below the chart (not another layer on
     top of it), so it never competes with the tree itself for space. */
  #activityBar{
    flex:none;height:150px;background:var(--panel);
    border-top:1px solid var(--border);display:flex;flex-direction:column;z-index:40;
  }
  #activityBar h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:0;padding:8px 16px 4px;flex:none;}
  #activityBar .body{overflow-y:auto;flex:1;padding:0 16px 26px;}
  #activityBar .empty{color:var(--sub2);font-size:12.5px;padding:6px 0;}
  .log-entry{padding:5px 0;font-size:12.5px;display:flex;gap:8px;align-items:baseline;border-bottom:1px dashed var(--border);}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .who{font-weight:700;color:var(--ink);white-space:nowrap;}
  .log-entry .what{color:var(--ink);}
  .log-entry .what .person{font-weight:600;color:var(--accent2);}
  .log-entry .when{color:var(--sub2);font-size:11px;white-space:nowrap;}

  @media (max-width: 720px){
    #activityBar{height:148px;}
    #activityBar h2{padding:7px 12px 4px;}
    #activityBar .body{padding:0 12px 24px;}
  }

  /* photo avatars — colored initials by default (exactly one gold, one red — the
     Wong-family palette, not a coded system); a real uploaded photo drops into the
     same slot automatically once someone adds one */
  .avatar{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:inherit;font-weight:700;letter-spacing:.01em;background-size:cover;background-position:center;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  .avatar-xs{width:18px;height:18px;font-size:7.5px;}
  .avatar-sm{width:30px;height:30px;font-size:11.5px;}
  .avatar-md{width:38px;height:38px;font-size:13.5px;}
  .avatar-lg{width:78px;height:78px;font-size:23px;margin:0 auto 10px;position:relative;}
  #focusCard .avatar-lg-wrap{position:relative;display:inline-block;cursor:pointer;}
  #focusCard .avatar-lg-wrap .addPhoto{position:absolute;right:-3px;bottom:9px;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px var(--panel);opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s;}
  #focusCard:hover .addPhoto{opacity:1;transform:scale(1);}

  /* Editor drawer — absolute within #app, so it never covers anything
     outside this widget's own box (the host page's nav included). */
  #overlay{position:absolute;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(2px);display:none;z-index:100;border-radius:16px;}
  #editor{
    position:absolute;top:0;right:0;bottom:0;width:380px;max-width:90%;background:var(--panel);z-index:101;
    box-shadow:var(--shadow-lg);display:none;flex-direction:column;
    border-left:1px solid var(--border);border-radius:0 16px 16px 0;
  }
  #editor h2{font-size:16px;font-weight:700;margin:0;padding:18px 20px;border-bottom:1px solid var(--border);color:var(--ink);}
  #editor .body{padding:18px 20px;overflow-y:auto;flex:1;}
  #editor label{display:block;font-size:11px;color:var(--sub);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  #editor input[type=text], #editor input[type=number], #editor textarea, #editor select{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:13.5px;
    background:var(--bg);color:var(--ink);transition:border-color .15s, box-shadow .15s;
  }
  #editor input:focus, #editor textarea:focus, #editor select:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel);
  }
  #editor textarea{min-height:74px;resize:vertical;}
  #editor .row{display:flex;gap:10px;}
  #editor .row > div{flex:1;}
  #editor .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  #editor .checkbox-row input{width:auto;}
  #editor .footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;}
  #editor .footer button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:600;transition:background .15s,transform .1s;}
  #editor .footer button:hover{background:var(--accent-soft);}
  #editor .footer button:active{transform:scale(.97);}
  #editor .footer button.save{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  #editor .footer button.save:hover{filter:brightness(1.08);}
  #editor .footer button.delete{color:var(--uncertain);border-color:var(--border);}
  #editor .footer button.delete:hover{background:var(--uncertain-soft);border-color:var(--uncertain);}
  #hint{font-size:11px;color:var(--sub2);margin-top:4px;line-height:1.4;}

  /* Guestbook — a permanent left-hand panel (not a drawer), always visible
     beside the tree, newest message first. */
  #mainRow{flex:1 1 auto;min-height:0;display:flex;overflow:hidden;}
  #contentCol{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;}

  #guestbookPanel{
    flex:none;width:270px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  #guestbookPanel h2{flex:none;font-size:12px;font-weight:700;margin:0;padding:14px 16px 12px;
    border-bottom:1px solid var(--border);color:var(--ink);text-transform:uppercase;letter-spacing:.05em;}
  #guestbookList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  #guestbookList .empty{color:var(--sub2);font-size:12.5px;padding:6px 0;}
  .gb-entry{border-bottom:1px dashed var(--border);padding-bottom:11px;}
  .gb-entry:last-child{border-bottom:none;padding-bottom:0;}
  .gb-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .gb-top .who{font-weight:700;color:var(--ink);font-size:12px;}
  .gb-top .when{color:var(--sub2);font-size:10px;white-space:nowrap;}
  .gb-msg{font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.5;white-space:pre-wrap;}
  .gb-remove{color:var(--sub2);font-size:10px;cursor:pointer;margin-top:4px;display:inline-block;}
  .gb-remove:hover{color:var(--uncertain);}
  .gb-more{text-align:center;padding-top:2px;}
  #btnMoreGuestbook{color:var(--sub);font-size:11.5px;cursor:pointer;font-weight:600;
    letter-spacing:.01em;border-bottom:1px dotted var(--sub2);padding-bottom:1px;}
  #btnMoreGuestbook:hover{color:var(--accent);border-bottom-color:var(--accent);}
  #guestbookComposer{flex:none;border-top:1px solid var(--border);padding:12px 16px;}
  #gb_message{width:100%;min-height:56px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;
    font-family:inherit;font-size:12.5px;background:var(--bg);color:var(--ink);resize:vertical;}
  #gb_message:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  #btnPostGuestbook{margin-top:7px;width:100%;padding:8px;border-radius:8px;border:none;
    background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12.5px;cursor:pointer;transition:filter .15s;}
  #btnPostGuestbook:hover{filter:brightness(1.08);}

  #spouseList{display:flex;flex-direction:column;gap:10px;}
  .spouseRow{border:1px solid var(--border);border-radius:10px;padding:10px 10px 11px;background:var(--bg);}
  .spouseRow .spouseRowTop{display:flex;gap:8px;align-items:center;}
  .spouseRow .spouseRowTop input{flex:1;}
  .spouseRow textarea{min-height:52px;margin-top:8px;}
  /* A visibly separate, labeled "photo" strip at the top of each spouse
     row -- not just a tiny icon buried next to their name -- so it's
     unmistakable there's a dedicated place to add their photo. */
  .spPhotoRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .spAvatarWrap{flex:none;position:relative;width:38px;height:38px;}
  .spAvatarWrap .avatar{cursor:default;}
  .spPhotoActions{display:flex;gap:7px;flex-wrap:wrap;}
  .spPhotoHint{font-size:11.5px;color:var(--sub2);font-style:italic;}
  .sp_photo_upload, .sp_photo_remove{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel);color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:5px;
    transition:color .15s,border-color .15s,background .15s;}
  .sp_photo_upload:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  .sp_photo_remove{color:var(--uncertain);}
  .sp_photo_remove:hover{background:var(--uncertain-soft);border-color:var(--uncertain);}
  .sp_remove{flex:none;width:30px;height:30px;padding:0;border-radius:8px;border:1px solid var(--border);
    background:var(--panel);color:var(--sub);cursor:pointer;font-size:14px;line-height:1;transition:background .15s,border-color .15s,color .15s;}
  .sp_remove:hover{background:var(--uncertain-soft);border-color:var(--uncertain);color:var(--uncertain);}
  #btnAddSpouse{margin-top:10px;width:100%;padding:9px;border-radius:9px;border:1px dashed var(--border);
    background:transparent;color:var(--sub);cursor:pointer;font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
  #btnAddSpouse:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--sub2);}

  /* ---------- phone / narrow-screen layout ----------
     Collapse the toolbar to icon-only buttons and tighten the focus-view
     spacing so the stage keeps most of the widget's height. */
  @media (max-width: 720px){
    #toolbar{padding:10px 12px;gap:6px;}
    #seal{width:34px;height:34px;}
    #seal span{font-size:19px;}
    #wordmark{font-size:16px;min-width:0;}
    #wordmark small{display:none;}
    #searchWrap{width:auto;flex:1 1 130px;}
    #search{font-size:12.5px;padding:7px 10px;}
    #toolbar button{padding:7px 9px;font-size:12.5px;}
    .lbl{display:none;}
    .divider{margin:8px 1px;}
    #app{height:min(88vh, 900px);border-radius:10px;}
    #toolbar{border-radius:10px 10px 0 0;}
    #breadcrumb{font-size:10.5px;padding:0 12px;}
    #stage{padding:20px 14px 32px;}
    #focusRow{gap:16px;}
    #focusCard{padding:20px 22px;min-width:0;width:100%;max-width:300px;}
    #focusCard .name{font-size:19px;}
    #siblingsCol{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;
      max-width:100%;padding-top:6px;gap:6px;}
    #siblingsCol .sibLabel{flex-basis:100%;justify-content:center;margin-bottom:0;}
    #spouseCards{max-width:100%;padding-top:6px;}
    .gkidsRow{max-width:160px;}

    /* Guestbook: stack below the tree (tree first) as a capped-height,
       collapsible-feeling strip rather than eating the screen. */
    #mainRow{flex-direction:column;}
    #contentCol{order:-1;flex:1 1 auto;}
    #guestbookPanel{width:100%;flex:none;max-height:200px;border-right:none;border-top:1px solid var(--border);}
    #guestbookPanel h2{padding:10px 14px 8px;font-size:11px;}
    #guestbookList{padding:8px 14px;gap:9px;}
    #guestbookComposer{padding:8px 14px 10px;}
    #gb_message{min-height:40px;}
  }
  @media (max-width: 720px) and (hover: none){
    /* touch devices: slightly larger tap targets on cards */
    .card{padding:10px 13px 11px;}
  }
</style>
</head>
<body>

<div id="app">
<div id="toolbar">
  <div id="seal"><span>黃</span></div>
  <div id="wordmark">The Wong Family<small>Est. Guangdong Province</small></div>
  <div class="divider"></div>
  <div id="searchWrap">
    <input type="text" id="search" placeholder="Jump to a name…" autocomplete="off">
    <div id="searchResults"></div>
  </div>
  <button id="btnAdd">＋<span class="lbl"> Add person</span></button>
  <div class="divider"></div>
  <button id="btnRoot" title="Start from the top">⌂<span class="lbl"> Start from the top</span></button>
  <button id="btnFullscreen" class="icon-btn" title="Expand to fullscreen">⛶</button>
  <div class="spacer"></div>
  <button id="btnTheme" class="icon-btn" title="Toggle light/dark">🌙</button>
</div>

<div id="mainRow">
  <div id="guestbookPanel">
    <h2>Family Guestbook</h2>
    <div id="guestbookList"></div>
    <div id="guestbookComposer">
      <textarea id="gb_message" placeholder="Leave a note, memory, or question for the family…"></textarea>
      <button id="btnPostGuestbook">Post</button>
    </div>
  </div>
  <div id="contentCol">
    <div id="breadcrumb"></div>
    <div id="stage"></div>
    <div id="activityBar">
      <h2>Recent activity</h2>
      <div class="body" id="activityList"></div>
    </div>
  </div>
</div>
<div id="bigPortraitBacking"></div>
<div id="bigPortrait"></div>

<div id="overlay"></div>
<div id="editor">
  <h2 id="editorTitle">Edit person</h2>
  <div id="editorMeta" style="display:none;padding:8px 20px 0;font-size:11px;color:var(--sub2)"></div>
  <div class="body">
    <div id="photoSection" style="text-align:center;margin-bottom:6px;display:none;">
      <div id="editorAvatarWrap"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">
        <button type="button" id="btnUploadPhoto" style="padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--ink);cursor:pointer;font-size:12.5px;font-weight:600;">Upload photo</button>
        <button type="button" id="btnRemovePhoto" style="display:none;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--uncertain);cursor:pointer;font-size:12.5px;font-weight:600;">Remove photo</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
      <div id="photoStatus" style="font-size:11.5px;color:var(--sub2);margin-top:6px;min-height:14px;"></div>
    </div>
    <div id="photoSectionNew" style="text-align:center;margin-bottom:10px;font-size:12px;color:var(--sub2);display:none;">
      Save this person first, then come back to add a photo.
    </div>
    <label>Name</label>
    <input type="text" id="f_name">

    <div class="row">
      <div>
        <label>Generation #</label>
        <input type="number" id="f_gen">
      </div>
      <div>
        <label>Dates</label>
        <input type="text" id="f_dates" placeholder="e.g. 1870-1920">
      </div>
    </div>

    <label>Parent</label>
    <select id="f_parent"></select>
    <div id="hint">Changing the parent auto-suggests generation = parent's generation + 1.</div>

    <label>Spouse(s)</label>
    <div id="spouseList"></div>
    <button type="button" id="btnAddSpouse">+ Add spouse</button>
    <div id="hint">Each spouse can have their own name and notes.</div>

    <label>Notes</label>
    <textarea id="f_note"></textarea>

    <label>Link confidence</label>
    <select id="f_confidence">
      <option value="clear">Clear — traced from an unambiguous bracket</option>
      <option value="positional">Positional — inferred from layout/order</option>
    </select>

    <div class="checkbox-row">
      <input type="checkbox" id="f_uncertain">
      <label style="margin:0;text-transform:none;font-size:13px;color:var(--ink)">Flag this whole entry as uncertain (name/spelling in doubt)</label>
    </div>
  </div>
  <div class="footer">
    <button class="delete" id="btnDelete">Delete</button>
    <button id="btnCancel">Cancel</button>
    <button class="save" id="btnSave">Save</button>
  </div>
</div>
</div><!-- /#app -->

  "dates": "2022-",
  "parent": "p100",
  "spouse": "",
  "note": "",
  "confidence": "clear",
  "uncertain": false
 }
]
</script>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "wong-family-tree-data-v1";
  const BASELINE_KEY = "wong-family-tree-baseline-v1";
  const CHANGELOG_KEY = "wong-family-tree-changelog-v1";
  const GUESTBOOK_KEY = "wong-family-tree-guestbook-v1";
  const EDITOR_NAME_KEY = "wong-family-tree-editor-name";
  const MAX_LOG_ENTRIES = 300;
  const MAX_GUESTBOOK_ENTRIES = 500;
  let DATA = [];
  let CHANGELOG = [];
  let GUESTBOOK = [];
  let editingId = null; // null while adding a new person

  // A visitor's browser only ever sees a NEW publish of this file if the file's
  // own embedded data differs from whatever this browser saw last time — so we
  // keep a copy of the exact embedded text alongside the working copy in
  // localStorage. Unchanged file -> trust localStorage (it may hold this
  // browser's own in-progress edits). Changed file -> the fresh publish wins,
  // and becomes the new baseline. Without this, re-uploading an updated export
  // would silently never reach anyone who had visited the page before, since
  // their old cached copy would keep winning forever.
  function loadData(){
    const embeddedText = document.getElementById("family-data-store").textContent;
    const storedBaseline = localStorage.getItem(BASELINE_KEY);
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && storedBaseline === embeddedText) {
      try { return JSON.parse(saved); } catch(e){ /* fall through */ }
    }
    const fresh = JSON.parse(embeddedText);
    localStorage.setItem(BASELINE_KEY, embeddedText);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }

  function persist(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    // keep the embedded script tag in sync so "Export updated page" always
    // captures the live data, regardless of where it originally came from.
    document.getElementById("family-data-store").textContent = JSON.stringify(DATA, null, 1);
    // push to the shared live database, if the sync layer below managed to
    // connect. If it never connected (offline, blocked network, no config),
    // this is a no-op and everything behaves exactly like local-only mode.
    if (window.__wftPushData) window.__wftPushData(DATA);
  }

  // ---------- "who's editing" + activity log ----------
  // No login here -- just a one-time, name-only nudge so edits can carry an
  // attribution and show up in a simple activity feed. Remembered per
  // browser, not verified or enforced (same trust level as the rest of the
  // shared-edit setup).
  function getEditorName(){
    let name = (localStorage.getItem(EDITOR_NAME_KEY) || "").trim();
    if (!name) {
      name = (window.prompt("Quick one-time question -- what's your name? It'll be attached to edits you make, so the family can see who updated what.", "") || "").trim();
      if (name) localStorage.setItem(EDITOR_NAME_KEY, name);
    }
    return name || "Someone";
  }

  function loadChangelog(){
    try {
      const saved = JSON.parse(localStorage.getItem(CHANGELOG_KEY));
      return Array.isArray(saved) ? saved : [];
    } catch(e){ return []; }
  }

  function logChange(action, personName){
    CHANGELOG.push({ by: getEditorName(), action, personName, at: new Date().toISOString() });
    if (CHANGELOG.length > MAX_LOG_ENTRIES) CHANGELOG = CHANGELOG.slice(-MAX_LOG_ENTRIES);
    localStorage.setItem(CHANGELOG_KEY, JSON.stringify(CHANGELOG));
    if (window.__wftPushLog) window.__wftPushLog(CHANGELOG);
    renderActivityLog();
  }

  // Full date + time, since this now sits on the page permanently rather
  // than in a popup someone opens right after making the edit.
  function formatWhen(iso){
    try {
      return new Date(iso).toLocaleString(undefined, { year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
    } catch(e){ return ""; }
  }

  function renderActivityLog(){
    const list = document.getElementById("activityList");
    if (!list) return;
    if (!CHANGELOG.length) {
      list.innerHTML = '<div class="empty">No edits logged yet. Once someone adds, edits, or deletes a person, it\'ll show up here.</div>';
      return;
    }
    list.innerHTML = CHANGELOG.slice().reverse().map(entry => {
      const verb = entry.action === "added" ? "added" : entry.action === "deleted" ? "deleted" : "edited";
      return `<div class="log-entry">` +
        `<div class="what"><span class="who">${escapeHtml(entry.by)}</span> ${verb} <span class="person">${escapeHtml(entry.personName)}</span></div>` +
        `<div class="when">${escapeHtml(formatWhen(entry.at))}</div>` +
        `</div>`;
    }).join("");
  }

  // ---------- family guestbook (one shared board, open to anyone — same
  // no-login trust model as the rest of this tool) ----------
  function loadGuestbook(){
    try {
      const saved = JSON.parse(localStorage.getItem(GUESTBOOK_KEY));
      return Array.isArray(saved) ? saved : [];
    } catch(e){ return []; }
  }

  function postGuestbookEntry(message){
    GUESTBOOK.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2),
      by: getEditorName(),
      message,
      at: new Date().toISOString()
    });
    if (GUESTBOOK.length > MAX_GUESTBOOK_ENTRIES) GUESTBOOK = GUESTBOOK.slice(-MAX_GUESTBOOK_ENTRIES);
    localStorage.setItem(GUESTBOOK_KEY, JSON.stringify(GUESTBOOK));
    if (window.__wftPushGuestbook) window.__wftPushGuestbook(GUESTBOOK);
    renderGuestbook();
  }

  function removeGuestbookEntry(id){
    GUESTBOOK = GUESTBOOK.filter(e => e.id !== id);
    localStorage.setItem(GUESTBOOK_KEY, JSON.stringify(GUESTBOOK));
    if (window.__wftPushGuestbook) window.__wftPushGuestbook(GUESTBOOK);
    renderGuestbook();
  }

  const GUESTBOOK_PAGE_SIZE = 10;
  let guestbookShown = GUESTBOOK_PAGE_SIZE;

  function renderGuestbook(){
    const list = document.getElementById("guestbookList");
    if (!list) return;
    if (!GUESTBOOK.length) {
      list.innerHTML = '<div class="empty">No messages yet — be the first to leave a note for the family.</div>';
      return;
    }
    const ordered = GUESTBOOK.slice().reverse();
    const visible = ordered.slice(0, guestbookShown);
    list.innerHTML = visible.map(entry => `
      <div class="gb-entry">
        <div class="gb-top"><span class="who">${escapeHtml(entry.by)}</span><span class="when">${escapeHtml(formatWhen(entry.at))}</span></div>
        <div class="gb-msg">${escapeHtml(entry.message)}</div>
        <span class="gb-remove" data-id="${entry.id}">remove</span>
      </div>`).join("")
      + (ordered.length > visible.length ? `<div class="gb-more"><span id="btnMoreGuestbook">View more (${ordered.length - visible.length} older)</span></div>` : "");
    list.querySelectorAll(".gb-remove").forEach(el => {
      el.addEventListener("click", () => {
        if (confirm("Remove this message from the guestbook?")) removeGuestbookEntry(el.dataset.id);
      });
    });
    const moreBtn = document.getElementById("btnMoreGuestbook");
    if (moreBtn) moreBtn.addEventListener("click", () => {
      guestbookShown += GUESTBOOK_PAGE_SIZE;
      renderGuestbook();
    });
  }

  document.getElementById("btnPostGuestbook").onclick = () => {
    const ta = document.getElementById("gb_message");
    const message = ta.value.trim();
    if (!message) return;
    postGuestbookEntry(message);
    ta.value = "";
  };

  function byId(id){ return DATA.find(p => p.id === id); }

  function newId(){
    let n = DATA.length + 1;
    while (byId("p" + n)) n++;
    return "p" + n;
  }

  // Spouses live inside their partner's own record, not as top-level DATA
  // entries, so they get their own lightweight id scheme -- just needs to be
  // stable and unique enough to key a photo-upload storage path and a DOM row.
  function newSpouseId(){
    return "sp" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ---------- photo avatars ----------
  // Colored-initials avatar by default; a real uploaded photo (person.photoUrl) takes
  // over the same slot automatically. Exactly one gold, one red — no shade variation —
  // so the color reads as "the Wong family palette" and never as an accidental code.
  const AVATAR_SHADES = [
    {l:82, c:0.15,  h:95},  // gold (true yellow-gold — 黃 Wong means gold/yellow)
    {l:53, c:0.235, h:27}   // cadmium red
  ];
  function hashStr(s){ let h = 0; for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  function avatarShade(name){ return AVATAR_SHADES[hashStr(name || "") % AVATAR_SHADES.length]; }
  function getInitials(name){
    const clean = (name||"").replace(/\([^)]*\)/g,'').replace(/^(Sir|Lady)\s+/i,'').trim();
    const parts = clean.split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function avatarHtml(p, sizeClass){
    if (p.photoUrl){
      return `<div class="avatar ${sizeClass}" style="background-image:url('${p.photoUrl}')"></div>`;
    }
    const sh = avatarShade(p.name);
    // true near-black on the light gold (not a hue-tinted brown, which reads muddy);
    // white on the dark cadmium red, where it already reads cleanly
    const fg = sh.l > 65 ? "oklch(18% 0.01 90)" : "oklch(99% 0.005 90)";
    const shadow = sh.l > 65 ? "none" : "0 1px 2px oklch(15% 0 0 / .55),0 0 1px oklch(15% 0 0 / .4)";
    return `<div class="avatar ${sizeClass}" style="background:oklch(${sh.l}% ${sh.c} ${sh.h});color:${fg};text-shadow:${shadow}">${getInitials(p.name)}</div>`;
  }

  const ICON = {
    spouse: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>',
    note:   '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h9M8 13h9M8 17h5"/></svg>',
    layers: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/></svg>',
    chevUp: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l7-7 7 7" opacity=".45"/><path d="M5 11l7-7 7 7"/></svg>',
    chevDown:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l7 7 7-7" opacity=".45"/><path d="M5 13l7 7 7-7"/></svg>',
    people: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 20c.3-2.7 1.8-4.6 4-4.9"/></svg>',
    dash:   '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
    chevron:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    camera: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
    pencil: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
  };

  // ---------- Focus View: one person at a time, click any relative to re-center ----------
  function kids(id){ return DATA.filter(p => (p.parent || null) === id); }
  function ancestorsOf(id){
    const chain = []; let cur = byId(id);
    while (cur && cur.parent && byId(cur.parent)) { chain.push(cur.parent); cur = byId(cur.parent); }
    return chain;
  }

  function cardHtml(p, extraClass){
    const cls = "card " + (extraClass||"") + (p.uncertain ? " uncertain" : "");
    return `<div class="${cls}" data-id="${p.id}">
      ${avatarHtml(p, "avatar-sm")}
      <div class="txt">
        <div class="name">${escapeHtml(p.name)}</div>
        ${p.dates ? `<div class="dates">${escapeHtml(p.dates)}</div>` : ""}
      </div>
    </div>`;
  }

  function ancestorTier(p, cls, label){
    if (!p) return "";
    return `<div class="tierLabel">${ICON.chevUp}${label}</div><div class="tier ${cls}">${cardHtml(p)}</div><div class="vline"></div>`;
  }

  // the larger, feathered "cameo portrait" that surfaces top-right on tap
  let bigPortraitOpen = false;
  function updateBigPortrait(p){
    const bp = document.getElementById("bigPortrait");
    if (p.photoUrl){
      bp.style.backgroundImage = `url('${p.photoUrl}')`;
      bp.style.color = "transparent";
      bp.textContent = "";
    } else {
      const sh = avatarShade(p.name);
      bp.style.backgroundImage = `linear-gradient(160deg, oklch(${Math.min(96,sh.l+6)}% ${sh.c*0.9} ${sh.h}), oklch(${Math.max(20,sh.l-10)}% ${sh.c} ${sh.h}))`;
      bp.style.color = sh.l > 65 ? "oklch(18% 0.01 90)" : "oklch(99% 0.005 90)";
      bp.style.textShadow = sh.l > 65 ? "none" : "0 2px 4px oklch(15% 0 0 / .55),0 0 2px oklch(15% 0 0 / .4)";
      bp.textContent = getInitials(p.name);
    }
  }
  function toggleBigPortrait(p){
    const bp = document.getElementById("bigPortrait");
    const backing = document.getElementById("bigPortraitBacking");
    bigPortraitOpen = !bigPortraitOpen;
    if (bigPortraitOpen){
      updateBigPortrait(p);
      bp.classList.add("show"); backing.classList.add("show");
      bp.onclick = () => toggleBigPortrait(p);
    } else {
      bp.classList.remove("show"); backing.classList.remove("show");
      bp.onclick = null;
    }
  }
  function closeBigPortrait(){
    bigPortraitOpen = false;
    document.getElementById("bigPortrait").classList.remove("show");
    document.getElementById("bigPortraitBacking").classList.remove("show");
  }
  document.addEventListener("click", (e) => {
    if (!bigPortraitOpen) return;
    if (e.target.closest("#bigPortrait") || e.target.closest(".avatar-lg-wrap")) return;
    closeBigPortrait();
  });

  let currentId = null;

  function render(id){
    if (!id || !byId(id)) {
      const roots = DATA.filter(p => !p.parent);
      id = (roots[0] || DATA[0] || {}).id;
      if (!id) return; // no data at all
    }
    currentId = id;
    const p = byId(id);
    const stage = document.getElementById("stage");
    stage.style.opacity = "0";

    const parentId = ancestorsOf(id)[0];
    const parent = parentId ? byId(parentId) : null;
    const grandId = parent ? ancestorsOf(parent.id)[0] : null;
    const grand = grandId ? byId(grandId) : null;
    const greatGrandId = grand ? ancestorsOf(grand.id)[0] : null;
    const greatGrand = greatGrandId ? byId(greatGrandId) : null;
    const siblings = parent ? kids(parent.id).filter(s => s.id !== p.id) : [];
    const children = kids(p.id);
    const spouses = (Array.isArray(p.spouses) ? p.spouses : [])
      .map(s => ({id:s.id, name:(s.name||"").trim(), note:(s.note||"").trim(), photoUrl:s.photoUrl})).filter(s=>s.name);

    let html = "";
    html += ancestorTier(greatGrand, "tier-anc-1", "Great-grandparent");
    html += ancestorTier(grand, "tier-anc-2", "Grandparent");
    html += ancestorTier(parent, "tier-anc-3", "Parent");

    html += `<div id="focusRow">`;
    if (siblings.length){
      html += `<div id="siblingsCol"><div class="sibLabel">${ICON.people}${siblings.length} sibling${siblings.length===1?"":"s"}</div>` +
        siblings.map(s => `<div class="sib-card${s.uncertain?" uncertain":""}" data-id="${s.id}">${avatarHtml(s,"avatar-xs")}<span>${escapeHtml(s.name)}</span></div>`).join("") + `</div>`;
    } else { html += `<div style="width:1px"></div>`; }

    html += `<div id="focusCard">`;
    html += `<div class="editBadge" title="Edit ${escapeHtml(p.name)}">${ICON.pencil}</div>`;
    if (p.uncertain) html += `<div class="uncertainBadge">?</div>`;
    html += `<div class="avatar-lg-wrap">${avatarHtml(p,"avatar-lg")}<div class="addPhoto" title="Add/edit photo">${ICON.camera}</div></div>`;
    html += `<div class="gen">${ICON.layers}Generation ${p.gen}</div>`;
    html += `<div class="name">${escapeHtml(p.name)}</div>`;
    if (p.dates) html += `<div class="dates">${escapeHtml(p.dates)}</div>`;
    if (p.note) html += `<div class="note">${ICON.note}<span>${escapeHtml(p.note)}</span></div>`;
    html += `<div class="cardSeal">黃</div>`;
    html += `</div>`;

    if (spouses.length){
      html += `<div id="spouseCards">` + spouses.map(s => `<div class="spouse-card"${s.photoUrl?' data-spouse-photo="1"':''} data-spouse-id="${s.id||''}" data-spouse-name="${escapeHtml(s.name)}" data-spouse-photo-url="${s.photoUrl?escapeHtml(s.photoUrl):''}">${avatarHtml({name:s.name, photoUrl:s.photoUrl},"avatar-sm")}<div><span>${escapeHtml(s.name)}</span>${s.note?`<div class="spouse-note">${escapeHtml(s.note)}</div>`:""}</div></div>`).join("") + `</div>`;
    } else { html += `<div style="width:1px"></div>`; }
    html += `</div>`; // #focusRow

    if (children.length){
      html += `<div class="vline"></div>`;
      html += `<div class="tierLabel">${ICON.chevDown}Children (${children.length})</div>`;
      html += `<div id="descendantsOuter"><div id="descendantsWrap">` + children.map(c => {
        const gkids = kids(c.id);
        let group = `<div class="childGroup">${cardHtml(c, "child-card")}`;
        if (gkids.length){
          group += `<div class="mini-vline"></div><div class="gkidsRow">` +
            gkids.map(g => `<div class="gkid-chip${g.uncertain?" uncertain":""}" data-id="${g.id}">${avatarHtml(g,"avatar-xs")}<span>${escapeHtml(g.name)}</span></div>`).join("") + `</div>`;
        }
        group += `</div>`;
        return group;
      }).join("") + `</div></div>`;
    } else {
      html += `<div class="vline"></div><div id="noChildren">${ICON.dash}No recorded children</div>`;
    }

    stage.innerHTML = html;
    requestAnimationFrame(() => { stage.style.transition = "opacity .22s ease"; stage.style.opacity = "1"; });

    stage.querySelectorAll("[data-id]").forEach(el => {
      el.addEventListener("click", () => render(el.dataset.id));
    });
    stage.scrollTop = 0;
    const dw = document.getElementById("descendantsWrap");
    if (dw) dw.scrollLeft = Math.max(0, (dw.scrollWidth - dw.clientWidth) / 2);

    // navigating away from a person always closes their portrait
    closeBigPortrait();
    const wrap = stage.querySelector(".avatar-lg-wrap");
    if (wrap){
      wrap.addEventListener("click", (e) => {
        if (e.target.closest(".addPhoto")) return; // that icon has its own job (below)
        toggleBigPortrait(p);
      });
    }
    const addPhotoBtn = stage.querySelector(".addPhoto");
    if (addPhotoBtn) addPhotoBtn.addEventListener("click", (e) => { e.stopPropagation(); openEditor(p.id); });
    const editBadge = stage.querySelector(".editBadge");
    if (editBadge) editBadge.addEventListener("click", (e) => { e.stopPropagation(); openEditor(p.id); });
    // tapping a spouse card either shows their photo bigger (same cameo the
    // main person gets) or, if they don't have one yet, jumps straight to
    // the editor's Spouse(s) section -- that's the only place a spouse photo
    // can be added, so tapping the card is never a dead end
    stage.querySelectorAll('.spouse-card').forEach(card => {
      card.addEventListener("click", (e) => {
        e.stopPropagation();
        if (card.hasAttribute("data-spouse-photo")) {
          toggleBigPortrait({ name: card.dataset.spouseName, photoUrl: card.dataset.spousePhotoUrl });
          return;
        }
        openEditor(p.id);
        const spouseId = card.dataset.spouseId;
        if (!spouseId) return;
        requestAnimationFrame(() => {
          const row = document.querySelector(`#spouseList .spouseRow[data-id="${spouseId}"]`);
          if (!row) return;
          row.scrollIntoView({ block: "center" });
          row.style.transition = "background .3s";
          row.style.background = "var(--accent-soft)";
          setTimeout(() => { row.style.background = ""; }, 900);
        });
      });
    });

    renderBreadcrumb(id);
  }

  function renderBreadcrumb(id){
    const chain = ancestorsOf(id).reverse().concat([id]); // root -> ... -> self
    let shown = chain;
    if (chain.length > 6) { shown = [chain[0], chain[1], "…", chain[chain.length-2], chain[chain.length-1]]; }
    const bc = document.getElementById("breadcrumb");
    bc.innerHTML = shown.map((cid,i) => {
      const isLast = i === shown.length-1;
      if (cid === "…") return `<span class="dots">···</span>`;
      const person = byId(cid);
      if (!person) return "";
      const name = escapeHtml(person.name);
      const icon = i === 0 ? `<span class="miniSeal">黃</span>` : "";
      const sep = isLast ? "" : `<span class="sep">${ICON.chevron}</span>`;
      return (isLast ? `<span class="current">${name}</span>` : `<span class="crumb" data-id="${cid}">${icon}${name}</span>`) + sep;
    }).join("");
    bc.querySelectorAll(".crumb").forEach(el => el.addEventListener("click", () => render(el.dataset.id)));
  }

  // ---------- search (jump to a person, doesn't just highlight) ----------
  const searchInput = document.getElementById("search");
  const resultsBox = document.getElementById("searchResults");
  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { resultsBox.style.display = "none"; return; }
    const matches = DATA.filter(p => p.name.toLowerCase().includes(q)).slice(0, 12);
    if (!matches.length) { resultsBox.style.display = "none"; return; }
    resultsBox.innerHTML = matches.map(p => `<div class="res" data-id="${p.id}"><span class="rn">${escapeHtml(p.name)}</span><span class="g">Gen. ${p.gen}</span></div>`).join("");
    resultsBox.style.display = "block";
    resultsBox.querySelectorAll(".res").forEach(el => el.addEventListener("click", () => {
      render(el.dataset.id); resultsBox.style.display = "none"; searchInput.value = "";
    }));
  });
  document.addEventListener("click", (e) => { if (!e.target.closest("#searchWrap")) resultsBox.style.display = "none"; });

  // ---------- "start from the top" ----------
  document.getElementById("btnRoot").addEventListener("click", () => {
    const roots = DATA.filter(p => !p.parent);
    if (roots[0]) render(roots[0].id);
  });

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- spouses (each spouse can carry their own name + notes) ----------
  // Older data stored a single free-text "spouse" string (sometimes several
  // names separated by ";"). migrateSpouses() converts any record still in
  // that shape into a "spouses" array the first time it's seen, so existing
  // text is never lost -- it just lands as each spouse's name, with an empty
  // notes box ready to fill in. Runs on every load path (local, imported,
  // and incoming from the shared database) so it's a no-op once everyone's
  // data has moved over.
  function migrateSpouses(arr){
    (arr || []).forEach(p => {
      if (!Array.isArray(p.spouses)) {
        const legacy = (p.spouse || "").toString();
        p.spouses = legacy
          ? legacy.split(";").map(s => s.trim()).filter(Boolean).map(name => ({name, note: ""}))
          : [];
      }
      delete p.spouse;
      // Backfill a stable id on any spouse that predates photo-upload support
      // (or just got migrated above) -- same one-time, idempotent shape as
      // the legacy-string migration itself.
      p.spouses.forEach(s => { if (!s.id) s.id = newSpouseId(); });
    });
    return arr;
  }

  // A spouse can only get a photo-upload slot once they have a stable id --
  // i.e. once they've been saved at least once, same "save first" rule the
  // main person's own photo already follows (see #photoSectionNew above).
  // Rendered as its own labeled strip (avatar + "Add photo"/"Change photo"/
  // "Remove photo" buttons), not a tiny icon easy to miss next to their name.
  function spousePhotoRowHtml(s){
    s = s || {};
    const av = avatarHtml({name:s.name || "", photoUrl:s.photoUrl}, "avatar-md");
    if (!s.id){
      return `<div class="spPhotoRow">
        <div class="spAvatarWrap">${av}</div>
        <div class="spPhotoHint">Save this spouse first, then come back to add a photo</div>
      </div>`;
    }
    return `<div class="spPhotoRow">
      <div class="spAvatarWrap">
        ${av}
        <input type="file" class="sp_photo_input" accept="image/*" style="display:none;">
      </div>
      <div class="spPhotoActions">
        <button type="button" class="sp_photo_upload">${ICON.camera} ${s.photoUrl ? "Change photo" : "Add photo"}</button>
        ${s.photoUrl ? `<button type="button" class="sp_photo_remove">Remove photo</button>` : ""}
      </div>
    </div>`;
  }

  function spouseRowHtml(s){
    s = s || {};
    return `<div class="spouseRow" data-id="${s.id || ""}">
      ${spousePhotoRowHtml(s)}
      <div class="spouseRowTop">
        <input type="text" class="sp_name" placeholder="Spouse name" value="${escapeHtml(s.name || "")}">
        <button type="button" class="sp_remove" title="Remove this spouse">✕</button>
      </div>
      <textarea class="sp_note" placeholder="Notes about this spouse (optional)">${escapeHtml(s.note || "")}</textarea>
    </div>`;
  }

  function wireSpouseRemove(row){
    row.querySelector(".sp_remove").addEventListener("click", () => {
      const wrap = document.getElementById("spouseList");
      const allRows = wrap.querySelectorAll(".spouseRow");
      if (allRows.length <= 1) {
        // keep at least one (empty) row visible rather than leaving a gap
        row.querySelector(".sp_name").value = "";
        row.querySelector(".sp_note").value = "";
        return;
      }
      row.remove();
    });
  }

  // Mirrors the main person's own upload/remove flow (see "photo upload"
  // below): mutates the live DATA record directly and persists right away,
  // independent of the editor's own Save button, so it's never lost.
  function wireSpousePhotoControls(row){
    const uploadBtn = row.querySelector(".sp_photo_upload");
    const fileInput = row.querySelector(".sp_photo_input");
    const removeBtn = row.querySelector(".sp_photo_remove");
    const refreshRowAvatar = (spouse) => {
      const slot = row.querySelector(".spPhotoRow");
      if (slot) slot.outerHTML = spousePhotoRowHtml(spouse);
      wireSpousePhotoControls(row);
    };
    if (uploadBtn && fileInput){
      uploadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        const spouseId = row.dataset.id;
        if (!file || !editingId || !spouseId) return;
        if (!file.type.startsWith("image/")) { alert("Please choose an image file."); return; }
        if (file.size > 8 * 1024 * 1024) { alert("That image is over 8MB — please choose a smaller one."); return; }
        if (!window.__wftUploadPhoto) { alert("Photo upload isn't available right now — try again in a moment."); return; }
        const p = byId(editingId);
        const spouse = p && Array.isArray(p.spouses) ? p.spouses.find(sp => sp.id === spouseId) : null;
        if (!spouse) return;
        try {
          const { url, path } = await window.__wftUploadPhoto(file, spouseId);
          const oldPath = spouse.photoPath;
          spouse.photoUrl = url;
          spouse.photoPath = path;
          p.lastEditedBy = getEditorName();
          p.lastEditedAt = new Date().toISOString();
          persist();
          logChange("added a photo for", `${spouse.name} (spouse of ${p.name})`);
          render(currentId);
          refreshRowAvatar(spouse);
          if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
        } catch (err) {
          console.warn("[Wong Family Tree] Spouse photo upload failed:", err);
          alert("Upload failed — check your connection and try again.");
        }
      });
    }
    if (removeBtn){
      removeBtn.addEventListener("click", () => {
        const spouseId = row.dataset.id;
        const p = editingId ? byId(editingId) : null;
        const spouse = p && Array.isArray(p.spouses) ? p.spouses.find(sp => sp.id === spouseId) : null;
        if (!spouse || !spouse.photoUrl) return;
        if (!confirm(`Remove ${spouse.name}'s photo?`)) return;
        const oldPath = spouse.photoPath;
        delete spouse.photoUrl;
        delete spouse.photoPath;
        p.lastEditedBy = getEditorName();
        p.lastEditedAt = new Date().toISOString();
        persist();
        logChange("removed the photo for", `${spouse.name} (spouse of ${p.name})`);
        render(currentId);
        refreshRowAvatar(spouse);
        if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
      });
    }
  }

  function renderSpouseRows(list){
    const wrap = document.getElementById("spouseList");
    const rows = (list && list.length) ? list : [{name:"",note:""}];
    wrap.innerHTML = rows.map(s => spouseRowHtml(s)).join("");
    wrap.querySelectorAll(".spouseRow").forEach(row => {
      wireSpouseRemove(row);
      wireSpousePhotoControls(row);
    });
  }

  // Reads current name/note straight off the form, but photo fields never
  // had a form control of their own -- those come from whatever's live on
  // the matching spouse in DATA right now (kept in sync by the upload/remove
  // handlers above), same "read fresh off DATA" rule the main person's photo
  // already follows in the Save handler below.
  function collectSpouseRows(existingSpouses){
    const existingById = new Map((existingSpouses || []).map(s => [s.id, s]));
    return Array.from(document.querySelectorAll("#spouseList .spouseRow")).map(row => {
      const name = row.querySelector(".sp_name").value.trim();
      const note = row.querySelector(".sp_note").value.trim();
      if (!name && !note) return null;
      const id = row.dataset.id || newSpouseId();
      const out = { id, name, note };
      const prior = existingById.get(id);
      if (prior && prior.photoUrl) { out.photoUrl = prior.photoUrl; out.photoPath = prior.photoPath; }
      return out;
    }).filter(Boolean);
  }

  document.getElementById("btnAddSpouse").addEventListener("click", () => {
    const wrap = document.getElementById("spouseList");
    wrap.insertAdjacentHTML("beforeend", spouseRowHtml({name:"",note:""}));
    const rows = wrap.querySelectorAll(".spouseRow");
    const last = rows[rows.length - 1];
    wireSpouseRemove(last);
    wireSpousePhotoControls(last);
    last.querySelector(".sp_name").focus();
  });

  // ---------- editor ----------
  function populateParentSelect(excludeId){
    const sel = document.getElementById("f_parent");
    sel.innerHTML = '<option value="">— none (root of chart) —</option>';
    DATA.slice().sort((a,b)=>a.gen-b.gen || a.name.localeCompare(b.name)).forEach(p => {
      if (p.id === excludeId) return;
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.name} (gen ${p.gen})`;
      sel.appendChild(opt);
    });
  }

  function openEditor(id){
    editingId = id;
    const isNew = !id;
    document.getElementById("editorTitle").textContent = isNew ? "Add person" : "Edit person";
    const p = isNew ? {name:"",gen:"",dates:"",parent:"",spouses:[],note:"",confidence:"clear",uncertain:false} : byId(id);
    populateParentSelect(id);
    document.getElementById("f_name").value = p.name || "";
    document.getElementById("f_gen").value = p.gen ?? "";
    document.getElementById("f_dates").value = p.dates || "";
    document.getElementById("f_parent").value = p.parent || "";
    renderSpouseRows(p.spouses || []);
    document.getElementById("f_note").value = p.note || "";
    document.getElementById("f_confidence").value = p.confidence || "clear";
    document.getElementById("f_uncertain").checked = !!p.uncertain;
    document.getElementById("btnDelete").style.display = isNew ? "none" : "block";
    document.getElementById("photoSection").style.display = isNew ? "none" : "block";
    document.getElementById("photoSectionNew").style.display = isNew ? "block" : "none";
    if (!isNew) updateEditorAvatarPreview(p);
    const meta = document.getElementById("editorMeta");
    if (!isNew && p.lastEditedBy) {
      meta.textContent = `Last updated by ${p.lastEditedBy}${p.lastEditedAt ? " · " + formatWhen(p.lastEditedAt) : ""}`;
      meta.style.display = "block";
    } else {
      meta.style.display = "none";
    }
    document.getElementById("overlay").style.display = "block";
    document.getElementById("editor").style.display = "flex";
  }

  function closeEditor(){
    document.getElementById("overlay").style.display = "none";
    document.getElementById("editor").style.display = "none";
    editingId = null;
  }

  // ---------- photo upload (editing person's own card only — see #photoSection) ----------
  function updateEditorAvatarPreview(p){
    document.getElementById("editorAvatarWrap").innerHTML = avatarHtml(p, "avatar-lg");
    document.getElementById("btnRemovePhoto").style.display = p.photoUrl ? "inline-flex" : "none";
  }
  function setPhotoStatus(msg, isError){
    const el = document.getElementById("photoStatus");
    el.textContent = msg || "";
    el.style.color = isError ? "var(--uncertain)" : "var(--sub2)";
  }
  document.getElementById("btnUploadPhoto").onclick = () => document.getElementById("photoInput").click();
  document.getElementById("photoInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || !editingId) return;
    if (!file.type.startsWith("image/")) { setPhotoStatus("Please choose an image file.", true); return; }
    if (file.size > 8 * 1024 * 1024) { setPhotoStatus("That image is over 8MB — please choose a smaller one.", true); return; }
    if (!window.__wftUploadPhoto) { setPhotoStatus("Photo upload isn't available right now — try again in a moment.", true); return; }
    const p = byId(editingId);
    if (!p) return;
    setPhotoStatus("Uploading…", false);
    try {
      const { url, path } = await window.__wftUploadPhoto(file, editingId);
      const oldPath = p.photoPath;
      p.photoUrl = url;
      p.photoPath = path;
      p.lastEditedBy = getEditorName();
      p.lastEditedAt = new Date().toISOString();
      persist();
      logChange("added a photo for", p.name);
      render(currentId);
      updateEditorAvatarPreview(p);
      setPhotoStatus("Photo updated.", false);
      if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
    } catch (err) {
      console.warn("[Wong Family Tree] Photo upload failed:", err);
      setPhotoStatus("Upload failed — check your connection and try again.", true);
    }
  });
  document.getElementById("btnRemovePhoto").onclick = () => {
    if (!editingId) return;
    const p = byId(editingId);
    if (!p || !p.photoUrl) return;
    if (!confirm(`Remove ${p.name}'s photo?`)) return;
    const oldPath = p.photoPath;
    delete p.photoUrl;
    delete p.photoPath;
    p.lastEditedBy = getEditorName();
    p.lastEditedAt = new Date().toISOString();
    persist();
    logChange("removed the photo for", p.name);
    render(currentId);
    updateEditorAvatarPreview(p);
    setPhotoStatus("Photo removed.", false);
    if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
  };

  document.getElementById("f_parent").addEventListener("change", (e) => {
    const parentId = e.target.value;
    const genField = document.getElementById("f_gen");
    if (parentId) {
      const parent = byId(parentId);
      if (parent && !genField.value) genField.value = parent.gen + 1;
      else if (parent) genField.value = parent.gen + 1;
    }
  });

  document.getElementById("btnCancel").onclick = closeEditor;
  document.getElementById("overlay").onclick = closeEditor;

  document.getElementById("btnSave").onclick = () => {
    const name = document.getElementById("f_name").value.trim();
    if (!name) { alert("Please enter a name."); return; }
    const gen = parseInt(document.getElementById("f_gen").value, 10);
    if (isNaN(gen)) { alert("Please enter a generation number."); return; }
    const wasNew = !editingId;
    // read the photo fields fresh off DATA (not off the form, which has no photo
    // fields) so a photo uploaded/removed earlier in this same editor session —
    // that flow persists immediately, independent of Save — is never lost here
    const existing = editingId ? byId(editingId) : null;
    const rec = {
      id: editingId || newId(),
      name,
      gen,
      dates: document.getElementById("f_dates").value.trim(),
      parent: document.getElementById("f_parent").value || null,
      spouses: collectSpouseRows(existing ? existing.spouses : []),
      note: document.getElementById("f_note").value.trim(),
      confidence: document.getElementById("f_confidence").value,
      uncertain: document.getElementById("f_uncertain").checked,
      lastEditedBy: getEditorName(),
      lastEditedAt: new Date().toISOString()
    };
    if (existing && existing.photoUrl) { rec.photoUrl = existing.photoUrl; rec.photoPath = existing.photoPath; }
    if (rec.parent === rec.id) { alert("A person can't be their own parent."); return; }
    if (editingId) {
      const idx = DATA.findIndex(p => p.id === editingId);
      DATA[idx] = rec;
    } else {
      DATA.push(rec);
    }
    persist();
    logChange(wasNew ? "added" : "edited", rec.name);
    render(rec.id);
    closeEditor();
  };

  document.getElementById("btnDelete").onclick = () => {
    if (!editingId) return;
    const children = DATA.filter(p => p.parent === editingId);
    if (children.length > 0) {
      const ok = confirm(`${children.length} people are linked to this person as their parent. Delete anyway and re-link them to this person's own parent?`);
      if (!ok) return;
      const rec = byId(editingId);
      children.forEach(c => c.parent = rec.parent || null);
    }
    const deletedRec = byId(editingId) || {};
    const deletedName = deletedRec.name || "someone";
    // land the view somewhere that still exists once this person is gone
    const fallbackId = deletedRec.parent && byId(deletedRec.parent) ? deletedRec.parent : null;
    DATA = DATA.filter(p => p.id !== editingId);
    persist();
    logChange("deleted", deletedName);
    render(fallbackId);
    closeEditor();
  };

  document.getElementById("btnAdd").onclick = () => openEditor(null);

  // ---------- fullscreen ----------
  const appEl = document.getElementById("app");
  document.getElementById("btnFullscreen").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (appEl.requestFullscreen) appEl.requestFullscreen();
  };
  document.addEventListener("fullscreenchange", () => {
    document.getElementById("btnFullscreen").textContent = document.fullscreenElement ? "⤢" : "⛶";
  });

  // ---------- theme ----------
  const THEME_KEY = "wong-family-tree-theme";
  function applyTheme(t){
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    document.getElementById("btnTheme").textContent = (t === "dark") ? "☀️" : "🌙";
  }
  document.getElementById("btnTheme").onclick = () => {
    const current = document.documentElement.getAttribute("data-theme")
      || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  };
  applyTheme(localStorage.getItem(THEME_KEY));

  // ---------- live shared sync (Firebase Realtime Database) ----------
  // The module script below (loaded separately, since Firebase only ships as
  // an ES module from the CDN) fills these two slots in once it connects:
  //   __wftPushData(data)   -> write this browser's data up to the shared DB
  // and calls these two, which we define here:
  //   __wftGetCurrentData() -> hand back whatever this browser currently has,
  //                            used once to seed the DB the very first time
  //                            it's ever empty
  //   __wftOnRemoteData(d)  -> called whenever the shared DB's data changes,
  //                            including changes made by someone else
  // If the module never loads or never connects (offline, blocked network,
  // no Firebase project configured), none of this fires and the tool works
  // exactly as it always has, off localStorage + the embedded data below.
  window.__wftGetCurrentData = function(){ return DATA; };
  window.__wftOnRemoteData = function(remote){
    if (!Array.isArray(remote) || !remote.length) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(DATA)) return; // nothing actually changed
    DATA = migrateSpouses(remote);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    document.getElementById("family-data-store").textContent = JSON.stringify(DATA, null, 1);
    localStorage.setItem(BASELINE_KEY, document.getElementById("family-data-store").textContent);
    // stay put if the person we're looking at still exists after this remote
    // change; render(...) itself falls back to the root if they don't
    render(currentId);
  };
  // Same idea, one level down: the activity log syncs on its own path so
  // everyone's "who changed what" feed matches, same as the tree data does.
  window.__wftGetCurrentLog = function(){ return CHANGELOG; };
  window.__wftOnRemoteLog = function(remote){
    if (!Array.isArray(remote)) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(CHANGELOG)) return;
    CHANGELOG = remote;
    localStorage.setItem(CHANGELOG_KEY, JSON.stringify(CHANGELOG));
    renderActivityLog();
  };
  // Same idea, one level down again: the guestbook syncs on its own path too.
  window.__wftGetCurrentGuestbook = function(){ return GUESTBOOK; };
  window.__wftOnRemoteGuestbook = function(remote){
    if (!Array.isArray(remote)) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(GUESTBOOK)) return;
    GUESTBOOK = remote;
    localStorage.setItem(GUESTBOOK_KEY, JSON.stringify(GUESTBOOK));
    renderGuestbook();
  };

  // ---------- init ----------
  DATA = migrateSpouses(loadData());
  CHANGELOG = loadChangelog();
  GUESTBOOK = loadGuestbook();
  render();
  renderActivityLog();
  renderGuestbook();
})();
</script>

<script type="module">
  // ---------- Firebase Realtime Database: live multi-user sync ----------
  // This talks to a shared database so every open copy of this page (any
  // computer, any browser) sees the same family-tree data and stays in
  // sync automatically. It is entirely additive: if this fails to load or
  // connect for any reason, the page falls back to the local-only behavior
  // it always had (see the plain <script> block above).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAWiPSyvdPoU8-LH0C3j8IZY7qHn19gXuw",
    authDomain: "wong-family-tree.firebaseapp.com",
    databaseURL: "https://wong-family-tree-default-rtdb.firebaseio.com",
    projectId: "wong-family-tree",
    storageBucket: "wong-family-tree.firebasestorage.app",
    messagingSenderId: "482850066709",
    appId: "1:482850066709:web:19e189598e1173b6f5991c"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "wongFamilyTree");
    const logRef = ref(db, "wongFamilyTreeLog");
    const guestbookRef = ref(db, "wongFamilyTreeGuestbook");
    const storage = getStorage(app);

    // ---------- photo uploads (Firebase Storage) ----------
    // Anyone with the page open can upload a photo for anyone else — there's no
    // login system here, by design (most of the people in this tree can't upload
    // their own photo; a living relative uploading an old photo of an ancestor is
    // the whole point). Storage's own security rules are what actually keep this
    // to images under a sane size — see the setup notes delivered alongside this file.
    window.__wftUploadPhoto = async function(file, personId){
      const path = `photos/${personId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9_.-]/g,"_")}`;
      const r = storageRef(storage, path);
      await uploadBytes(r, file, { contentType: file.type });
      const url = await getDownloadURL(r);
      return { url, path };
    };
    window.__wftDeletePhoto = async function(path){
      // Best-effort cleanup of the previous photo when it's replaced or removed —
      // never blocks the UI and never surfaces an error if it fails.
      try { await deleteObject(storageRef(storage, path)); }
      catch (err) { console.warn("[Wong Family Tree] Could not delete old photo (leaving it in Storage):", err); }
    };

    window.__wftPushData = function(data){
      set(dataRef, data).catch(err => console.warn("[Wong Family Tree] Could not save to the shared database:", err));
    };
    window.__wftPushLog = function(log){
      set(logRef, log).catch(err => console.warn("[Wong Family Tree] Could not save the activity log:", err));
    };
    window.__wftPushGuestbook = function(entries){
      set(guestbookRef, entries).catch(err => console.warn("[Wong Family Tree] Could not save the guestbook:", err));
    };

    onValue(dataRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        // Shared database is empty (first time it's ever been used) -- seed
        // it with whatever this page currently has, so everyone else who
        // opens it from now on sees real data instead of nothing.
        if (window.__wftGetCurrentData) window.__wftPushData(window.__wftGetCurrentData());
        return;
      }
      if (window.__wftOnRemoteData) window.__wftOnRemoteData(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Live sync listener error (running in local-only mode):", err);
    });

    onValue(logRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        if (window.__wftGetCurrentLog) window.__wftPushLog(window.__wftGetCurrentLog());
        return;
      }
      if (window.__wftOnRemoteLog) window.__wftOnRemoteLog(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Activity log sync error (running in local-only mode):", err);
    });

    onValue(guestbookRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        if (window.__wftGetCurrentGuestbook) window.__wftPushGuestbook(window.__wftGetCurrentGuestbook());
        return;
      }
      if (window.__wftOnRemoteGuestbook) window.__wftOnRemoteGuestbook(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Guestbook sync error (running in local-only mode):", err);
    });

    console.log("[Wong Family Tree] Connected to the shared live database.");
  } catch (err) {
    console.warn("[Wong Family Tree] Live sync unavailable, running in local-only mode:", err);
  }
</script>
</body>
