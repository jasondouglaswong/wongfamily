<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wong Family</title>
<style>
  :root{
    --bg:#f4f6fb; --canvas-dot:#e3e8f3; --panel:#ffffff; --ink:#0f172a; --sub:#64748b; --sub2:#94a3b8;
    --line-clear:#94a3b8; --line-pos:#d97706; --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef0ff;
    --accent2:#0d9488; --border:#e2e8f0; --uncertain:#e11d48; --uncertain-soft:#fff1f2;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
    --shadow-lg:0 12px 32px rgba(15,23,42,.16), 0 2px 8px rgba(15,23,42,.08);
    --radius:12px;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0b1220; --canvas-dot:#182338; --panel:#131b2e; --ink:#e7ebf3; --sub:#9aa6bb; --sub2:#6f7c94;
    --line-clear:#5b677e; --line-pos:#e0a64b; --accent:#818cf8; --accent-ink:#0b1024; --accent-soft:#1c2140;
    --accent2:#2dd4bf; --border:#232e47; --uncertain:#fb7185; --uncertain-soft:#2a1620;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --canvas-dot:#182338; --panel:#131b2e; --ink:#e7ebf3; --sub:#9aa6bb; --sub2:#6f7c94;
      --line-clear:#5b677e; --line-pos:#e0a64b; --accent:#818cf8; --accent-ink:#0b1024; --accent-soft:#1c2140;
      --accent2:#2dd4bf; --border:#232e47; --uncertain:#fb7185; --uncertain-soft:#2a1620;
      --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;}
  html{margin:0;padding:0;}
  body{margin:0;padding:0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  /* Everything the tree needs lives inside this one box, positioned in the
     normal page flow — so dropping this file into an existing site (or an
     "embed HTML" block) never covers that site's own header/nav, and the
     page around it scrolls normally. Fixed/absolute elements below are all
     scoped to this box, never to the browser viewport. */
  #app{
    position:relative; isolation:isolate; width:100%;
    height:min(85vh, 900px); min-height:520px;
    overflow:hidden; background:var(--bg);
    border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg);
  }
  #app:fullscreen{ height:100vh; border-radius:0; }

  #toolbar{
    position:absolute;top:0;left:0;right:0;height:60px;background:color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);border-radius:16px 16px 0 0;
    display:flex;align-items:center;gap:10px;padding:0 16px;z-index:50;flex-wrap:wrap;
  }
  #toolbar h1{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0 6px 0 0;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px;}
  #toolbar h1 .logo-dot{width:22px;height:22px;display:inline-flex;color:var(--accent);flex:none;}
  #toolbar h1 .logo-dot svg{width:100%;height:100%;}
  .divider{width:1px;align-self:stretch;margin:12px 2px;background:var(--border);}

  #toolbar button, #toolbar input[type=text]{
    font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--border);border-radius:9px;
    background:var(--panel);cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s,transform .1s;
    display:inline-flex;align-items:center;gap:6px;
  }
  #toolbar button:hover{background:var(--accent-soft);border-color:var(--accent);}
  #toolbar button:active{transform:scale(.97);}
  #toolbar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  #toolbar button.primary:hover{filter:brightness(1.08);}
  #toolbar button.icon-btn{padding:7px 9px;}
  #search{width:190px;cursor:text;}
  #search:focus, #toolbar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  #zoomlabel{font-size:12px;color:var(--sub);min-width:38px;text-align:center;font-variant-numeric:tabular-nums;}
  .spacer{flex:1;}
  #legend{font-size:11.5px;color:var(--sub);display:flex;gap:14px;align-items:center;white-space:nowrap;}
  #legend span{display:inline-flex;align-items:center;gap:5px;}
  #legend .swatch{width:16px;height:2px;display:inline-block;border-radius:2px;}
  #legend .dot{width:8px;height:8px;border-radius:50%;background:var(--uncertain);display:inline-block;}

  #canvas-wrap{position:absolute;top:60px;left:0;right:0;bottom:130px;overflow:auto;color:var(--ink);
      background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22260%22%20height%3D%22260%22%3E%3Ctext%20x%3D%2240%22%20y%3D%22190%22%20font-size%3D%22160%22%20font-family%3D%22Georgia%2C%20%27Songti%20SC%27%2C%20serif%22%20fill%3D%22%230f172a%22%20opacity%3D%220.05%22%3E%E9%BB%84%3C/text%3E%3C/svg%3E") 0 0/260px 260px,
      radial-gradient(circle at 18px 18px, var(--canvas-dot) 1.4px, transparent 1.4px) 0 0/26px 26px, var(--bg);}
  /* Dark mode needs its own pass with a light-colored glyph baked in — a data-URI
     background image doesn't inherit the page's `color`, so `currentColor` inside
     one silently renders black regardless of theme (invisible on a dark ground). */
  [data-theme="dark"] #canvas-wrap{
      background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22260%22%20height%3D%22260%22%3E%3Ctext%20x%3D%2240%22%20y%3D%22190%22%20font-size%3D%22160%22%20font-family%3D%22Georgia%2C%20%27Songti%20SC%27%2C%20serif%22%20fill%3D%22%23e7ebf3%22%20opacity%3D%220.06%22%3E%E9%BB%84%3C/text%3E%3C/svg%3E") 0 0/260px 260px,
      radial-gradient(circle at 18px 18px, var(--canvas-dot) 1.4px, transparent 1.4px) 0 0/26px 26px, var(--bg);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) #canvas-wrap{
      background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22260%22%20height%3D%22260%22%3E%3Ctext%20x%3D%2240%22%20y%3D%22190%22%20font-size%3D%22160%22%20font-family%3D%22Georgia%2C%20%27Songti%20SC%27%2C%20serif%22%20fill%3D%22%23e7ebf3%22%20opacity%3D%220.06%22%3E%E9%BB%84%3C/text%3E%3C/svg%3E") 0 0/260px 260px,
      radial-gradient(circle at 18px 18px, var(--canvas-dot) 1.4px, transparent 1.4px) 0 0/26px 26px, var(--bg);}
  }

  /* Activity log -- a permanent strip below the chart (not another layer on
     top of it), so it never competes with the tree itself for space. */
  #activityBar{
    position:absolute;left:0;right:0;bottom:0;height:130px;background:var(--panel);
    border-top:1px solid var(--border);border-radius:0 0 16px 16px;display:flex;flex-direction:column;z-index:40;
  }
  #activityBar h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:0;padding:9px 16px 6px;flex:none;}
  #activityBar .body{overflow-y:auto;flex:1;padding:0 16px 8px;}
  #activityBar .empty{color:var(--sub2);font-size:12.5px;padding:6px 0;}
  .log-entry{padding:5px 0;font-size:12.5px;display:flex;gap:8px;align-items:baseline;border-bottom:1px dashed var(--border);}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .who{font-weight:700;color:var(--ink);white-space:nowrap;}
  .log-entry .what{color:var(--ink);flex:1;}
  .log-entry .what .person{font-weight:600;color:var(--accent2);}
  .log-entry .when{color:var(--sub2);font-size:11px;white-space:nowrap;}

  @media (max-width: 720px){
    #activityBar{height:96px;}
    #activityBar .body{padding:0 12px 6px;}
  }

  #canvas{position:relative;transform-origin:0 0;}
  svg#lines{position:absolute;top:0;left:0;pointer-events:none;}

  .node{
    position:absolute;background:var(--panel);border:1px solid var(--border);border-top-width:3px;border-radius:var(--radius);
    padding:9px 13px 10px;font-size:13px;line-height:1.45;cursor:pointer;box-shadow:var(--shadow);
    min-width:168px; max-width:246px;transition:box-shadow .15s,border-color .15s,transform .15s;
  }
  .node:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);z-index:4;}
  .node-row{display:flex;align-items:center;gap:9px;}
  .node-row .txt{min-width:0;flex:1;}
  .node .name{font-weight:700;color:var(--ink);letter-spacing:-.01em;font-size:13.5px;}
  .node .dates{color:var(--sub);font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
  .node .spouse{color:var(--accent2);font-size:11.5px;margin-top:3px;font-weight:600;}
  .node .spouse::before{content:"⚭ ";}
  .node .note-flag{
    position:absolute; bottom:5px; right:7px; width:14px;height:14px;border-radius:50%;
    background:var(--accent-soft); color:var(--accent2); opacity:.85;
    display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;
  }

  /* photo avatars — colored initials by default (exactly one gold, one red — the
     Wong-family palette, not a coded system); a real uploaded photo drops into the
     same slot automatically once someone adds one */
  .avatar{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:inherit;font-weight:700;letter-spacing:.01em;background-size:cover;background-position:center;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  .avatar-sm{width:30px;height:30px;font-size:11.5px;}
  .avatar-lg{width:78px;height:78px;font-size:23px;margin:0 auto 10px;position:relative;}
  .node.uncertain{border-color:var(--uncertain);}
  .node.uncertain::after{
    content:"?"; position:absolute; top:-7px; right:-7px; background:var(--uncertain); color:#fff;
    width:16px;height:16px;border-radius:50%;font-size:10.5px;line-height:16px;text-align:center;font-weight:700;
    box-shadow:0 0 0 2px var(--panel);
  }
  .node.root{border-width:2px;box-shadow:0 0 0 4px var(--accent-soft), var(--shadow-lg);}
  .node.root::before{
    content:"🌳"; position:absolute; top:-11px; left:-11px; width:22px;height:22px;border-radius:50%;
    background:var(--panel); border:1px solid var(--border); display:flex;align-items:center;justify-content:center;
    font-size:12px; box-shadow:var(--shadow);
  }
  .gen-label{
    position:absolute; top:16px; font-size:11.5px; font-weight:700; letter-spacing:.03em;
    color:#fff; padding:5px 13px 5px 11px; border-radius:999px; white-space:nowrap;
    box-shadow:var(--shadow); text-transform:uppercase; display:flex; align-items:center; gap:5px;
  }
  .gen-label::before{content:"";width:7px;height:7px;border-radius:2px;background:rgba(255,255,255,.85);
    transform:rotate(45deg);flex:none;}
  .node.highlight{outline:3px solid #facc15; outline-offset:1px; z-index:5;}

  /* Editor drawer — absolute within #app, so it never covers anything
     outside this widget's own box (the host page's nav included). */
  #overlay{position:absolute;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(2px);display:none;z-index:100;border-radius:16px;}
  #editor{
    position:absolute;top:0;right:0;bottom:0;width:380px;max-width:90%;background:var(--panel);z-index:101;
    box-shadow:var(--shadow-lg);display:none;flex-direction:column;
    border-left:1px solid var(--border);border-radius:0 16px 16px 0;
  }
  #editor h2{font-size:16px;font-weight:700;margin:0;padding:18px 20px;border-bottom:1px solid var(--border);color:var(--ink);}
  #editor .body{padding:18px 20px;overflow-y:auto;flex:1;}
  #editor label{display:block;font-size:11px;color:var(--sub);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  #editor input[type=text], #editor input[type=number], #editor textarea, #editor select{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:13.5px;
    background:var(--bg);color:var(--ink);transition:border-color .15s, box-shadow .15s;
  }
  #editor input:focus, #editor textarea:focus, #editor select:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel);
  }
  #editor textarea{min-height:74px;resize:vertical;}
  #editor .row{display:flex;gap:10px;}
  #editor .row > div{flex:1;}
  #editor .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  #editor .checkbox-row input{width:auto;}
  #editor .footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;}
  #editor .footer button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:600;transition:background .15s,transform .1s;}
  #editor .footer button:hover{background:var(--accent-soft);}
  #editor .footer button:active{transform:scale(.97);}
  #editor .footer button.save{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  #editor .footer button.save:hover{filter:brightness(1.08);}
  #editor .footer button.delete{color:var(--uncertain);border-color:var(--border);}
  #editor .footer button.delete:hover{background:var(--uncertain-soft);border-color:var(--uncertain);}
  #hint{font-size:11px;color:var(--sub2);margin-top:4px;line-height:1.4;}
  #fileimport{display:none;}

  #spouseList{display:flex;flex-direction:column;gap:10px;}
  .spouseRow{border:1px solid var(--border);border-radius:10px;padding:10px 10px 11px;background:var(--bg);}
  .spouseRow .spouseRowTop{display:flex;gap:8px;align-items:center;}
  .spouseRow .spouseRowTop input{flex:1;}
  .spouseRow textarea{min-height:52px;margin-top:8px;}
  .sp_remove{flex:none;width:30px;height:30px;padding:0;border-radius:8px;border:1px solid var(--border);
    background:var(--panel);color:var(--sub);cursor:pointer;font-size:14px;line-height:1;transition:background .15s,border-color .15s,color .15s;}
  .sp_remove:hover{background:var(--uncertain-soft);border-color:var(--uncertain);color:var(--uncertain);}
  #btnAddSpouse{margin-top:10px;width:100%;padding:9px;border-radius:9px;border:1px dashed var(--border);
    background:transparent;color:var(--sub);cursor:pointer;font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s;}
  #btnAddSpouse:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--sub2);}

  /* ---------- phone / narrow-screen layout ----------
     Collapse the toolbar to icon-only buttons and drop the legend so it
     takes 2 compact rows instead of 6, and give the tree itself most of
     the widget's height back. */
  @media (max-width: 720px){
    #toolbar{padding:8px 10px;gap:6px;}
    #toolbar h1{font-size:14px;margin-right:2px;}
    #toolbar h1 .logo-dot{width:19px;height:19px;}
    #search{width:auto;flex:1 1 130px;font-size:12.5px;padding:7px 10px;}
    #toolbar button{padding:7px 9px;font-size:12.5px;}
    .lbl{display:none;}
    #legend{display:none;}
    .divider{margin:8px 1px;}
    #app{height:min(88vh, 900px);border-radius:10px;}
    #toolbar{border-radius:10px 10px 0 0;}
    #canvas-wrap{border-radius:0 0 10px 10px;}
  }
  @media (max-width: 720px) and (hover: none){
    /* touch devices: slightly larger tap targets on cards */
    .node{padding:10px 13px 11px;}
  }
</style>
</head>
<body>

<div id="app">
<div id="toolbar">
  <h1><span class="logo-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v6"/><path d="M12 9c-3.5 0-5.5 2-5.5 4.5S8.5 17 12 17s5.5-1.5 5.5-4.5S15.5 9 12 9z"/>
      <path d="M12 17v4"/><circle cx="7" cy="20" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="21" r="1.6" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.6" fill="currentColor" stroke="none"/>
      <path d="M7 20v-3M17 20v-3"/></svg></span>The Wong Family</h1>
  <div class="divider"></div>
  <input type="text" id="search" placeholder="🔍 Search a name…">
  <button id="btnAdd">＋<span class="lbl"> Add person</span></button>
  <div class="divider"></div>
  <button id="btnZoomOut" class="icon-btn" title="Zoom out">−</button>
  <span id="zoomlabel">100%</span>
  <button id="btnZoomIn" class="icon-btn" title="Zoom in">+</button>
  <button id="btnFit" title="Fit whole tree to screen">▣<span class="lbl"> Fit to screen</span></button>
  <button id="btnFullscreen" class="icon-btn" title="Expand to fullscreen">⛶</button>
  <div class="spacer"></div>
  <div id="legend">
    <span><span class="swatch" style="background:var(--line-clear)"></span>clear bracket</span>
    <span><span class="swatch" style="background:var(--line-pos);border-top:2px dashed var(--line-pos)"></span>positional guess</span>
    <span><span class="dot"></span>flagged uncertain</span>
  </div>
  <div class="spacer"></div>
  <button id="btnTheme" class="icon-btn" title="Toggle light/dark">🌙</button>
  <div class="divider"></div>
  <button id="btnExportJSON" title="Download the raw data as JSON">{ }<span class="lbl"> Data (.json)</span></button>
  <button id="btnImportJSON" title="Load a previously exported JSON file">⇧<span class="lbl"> Import</span></button>
  <button id="btnExportHTML" class="primary" title="Download this whole page with your edits baked in">⇩<span class="lbl"> Updated page (.html)</span></button>
  <input type="file" id="fileimport" accept=".json">
</div>

<div id="canvas-wrap">
  <div id="canvas">
    <svg id="lines"></svg>
  </div>
</div>

<div id="activityBar">
  <h2>Recent activity</h2>
  <div class="body" id="activityList"></div>
</div>

<div id="overlay"></div>
<div id="editor">
  <h2 id="editorTitle">Edit person</h2>
  <div id="editorMeta" style="display:none;padding:8px 20px 0;font-size:11px;color:var(--sub2)"></div>
  <div class="body">
    <div id="photoSection" style="text-align:center;margin-bottom:6px;display:none;">
      <div id="editorAvatarWrap"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">
        <button type="button" id="btnUploadPhoto" style="padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--ink);cursor:pointer;font-size:12.5px;font-weight:600;">Upload photo</button>
        <button type="button" id="btnRemovePhoto" style="display:none;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--uncertain);cursor:pointer;font-size:12.5px;font-weight:600;">Remove photo</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
      <div id="photoStatus" style="font-size:11.5px;color:var(--sub2);margin-top:6px;min-height:14px;"></div>
    </div>
    <div id="photoSectionNew" style="text-align:center;margin-bottom:10px;font-size:12px;color:var(--sub2);display:none;">
      Save this person first, then come back to add a photo.
    </div>
    <label>Name</label>
    <input type="text" id="f_name">

    <div class="row">
      <div>
        <label>Generation #</label>
        <input type="number" id="f_gen">
      </div>
      <div>
        <label>Dates</label>
        <input type="text" id="f_dates" placeholder="e.g. 1870-1920">
      </div>
    </div>

    <label>Parent</label>
    <select id="f_parent"></select>
    <div id="hint">Changing the parent auto-suggests generation = parent's generation + 1.</div>

    <label>Spouse(s)</label>
    <div id="spouseList"></div>
    <button type="button" id="btnAddSpouse">+ Add spouse</button>
    <div id="hint">Each spouse can have their own name and notes.</div>

    <label>Notes</label>
    <textarea id="f_note"></textarea>

    <label>Link confidence</label>
    <select id="f_confidence">
      <option value="clear">Clear — traced from an unambiguous bracket</option>
      <option value="positional">Positional — inferred from layout/order</option>
    </select>

    <div class="checkbox-row">
      <input type="checkbox" id="f_uncertain">
      <label style="margin:0;text-transform:none;font-size:13px;color:var(--ink)">Flag this whole entry as uncertain (name/spelling in doubt)</label>
    </div>
  </div>
  <div class="footer">
    <button class="delete" id="btnDelete">Delete</button>
    <button id="btnCancel">Cancel</button>
    <button class="save" id="btnSave">Save</button>
  </div>
</div>
</div><!-- /#app -->

<script id="family-data-store" type="application/json">
[
 {
  "id": "p1",
  "gen": 1,

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "wong-family-tree-data-v1";
  const BASELINE_KEY = "wong-family-tree-baseline-v1";
  const CHANGELOG_KEY = "wong-family-tree-changelog-v1";
  const EDITOR_NAME_KEY = "wong-family-tree-editor-name";
  const MAX_LOG_ENTRIES = 300;
  let DATA = [];
  let CHANGELOG = [];
  let editingId = null; // null while adding a new person
  let scale = 1;
  let hasFit = false;

  // A visitor's browser only ever sees a NEW publish of this file if the file's
  // own embedded data differs from whatever this browser saw last time — so we
  // keep a copy of the exact embedded text alongside the working copy in
  // localStorage. Unchanged file -> trust localStorage (it may hold this
  // browser's own in-progress edits). Changed file -> the fresh publish wins,
  // and becomes the new baseline. Without this, re-uploading an updated export
  // would silently never reach anyone who had visited the page before, since
  // their old cached copy would keep winning forever.
  function loadData(){
    const embeddedText = document.getElementById("family-data-store").textContent;
    const storedBaseline = localStorage.getItem(BASELINE_KEY);
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && storedBaseline === embeddedText) {
      try { return JSON.parse(saved); } catch(e){ /* fall through */ }
    }
    const fresh = JSON.parse(embeddedText);
    localStorage.setItem(BASELINE_KEY, embeddedText);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }

  function persist(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    // keep the embedded script tag in sync so "Export updated page" always
    // captures the live data, regardless of where it originally came from.
    document.getElementById("family-data-store").textContent = JSON.stringify(DATA, null, 1);
    // push to the shared live database, if the sync layer below managed to
    // connect. If it never connected (offline, blocked network, no config),
    // this is a no-op and everything behaves exactly like local-only mode.
    if (window.__wftPushData) window.__wftPushData(DATA);
  }

  // ---------- "who's editing" + activity log ----------
  // No login here -- just a one-time, name-only nudge so edits can carry an
  // attribution and show up in a simple activity feed. Remembered per
  // browser, not verified or enforced (same trust level as the rest of the
  // shared-edit setup).
  function getEditorName(){
    let name = (localStorage.getItem(EDITOR_NAME_KEY) || "").trim();
    if (!name) {
      name = (window.prompt("Quick one-time question -- what's your name? It'll be attached to edits you make, so the family can see who updated what.", "") || "").trim();
      if (name) localStorage.setItem(EDITOR_NAME_KEY, name);
    }
    return name || "Someone";
  }

  function loadChangelog(){
    try {
      const saved = JSON.parse(localStorage.getItem(CHANGELOG_KEY));
      return Array.isArray(saved) ? saved : [];
    } catch(e){ return []; }
  }

  function logChange(action, personName){
    CHANGELOG.push({ by: getEditorName(), action, personName, at: new Date().toISOString() });
    if (CHANGELOG.length > MAX_LOG_ENTRIES) CHANGELOG = CHANGELOG.slice(-MAX_LOG_ENTRIES);
    localStorage.setItem(CHANGELOG_KEY, JSON.stringify(CHANGELOG));
    if (window.__wftPushLog) window.__wftPushLog(CHANGELOG);
    renderActivityLog();
  }

  // Full date + time, since this now sits on the page permanently rather
  // than in a popup someone opens right after making the edit.
  function formatWhen(iso){
    try {
      return new Date(iso).toLocaleString(undefined, { year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
    } catch(e){ return ""; }
  }

  function renderActivityLog(){
    const list = document.getElementById("activityList");
    if (!list) return;
    if (!CHANGELOG.length) {
      list.innerHTML = '<div class="empty">No edits logged yet. Once someone adds, edits, or deletes a person, it\'ll show up here.</div>';
      return;
    }
    list.innerHTML = CHANGELOG.slice().reverse().map(entry => {
      const verb = entry.action === "added" ? "added" : entry.action === "deleted" ? "deleted" : "edited";
      return `<div class="log-entry">` +
        `<div class="what"><span class="who">${escapeHtml(entry.by)}</span> ${verb} <span class="person">${escapeHtml(entry.personName)}</span></div>` +
        `<div class="when">${escapeHtml(formatWhen(entry.at))}</div>` +
        `</div>`;
    }).join("");
  }

  function byId(id){ return DATA.find(p => p.id === id); }

  function newId(){
    let n = DATA.length + 1;
    while (byId("p" + n)) n++;
    return "p" + n;
  }

  // ---------- layout ----------
  // Generation columns run left-to-right (this suits the data far better than a
  // top-down/vertical layout: generation sizes here range from 1 person to 70+,
  // so a vertical layout would force some rows to be absurdly wide. Columns let
  // every generation just scroll vertically at a consistent, readable width).
  const PALETTE = ["#4f46e5","#0d9488","#b45309","#be185d","#0369a1","#6d28d9","#15803d","#9333ea","#c2410c","#0e7490"];
  function genColor(i){ return PALETTE[i % PALETTE.length]; }

  // ---------- photo avatars ----------
  // Colored-initials avatar by default; a real uploaded photo (person.photoUrl) takes
  // over the same slot automatically. Exactly one gold, one red — no shade variation —
  // so the color reads as "the Wong family palette" and never as an accidental code.
  const AVATAR_SHADES = [
    {l:82, c:0.15,  h:95},  // gold (true yellow-gold — 黃 Wong means gold/yellow)
    {l:53, c:0.235, h:27}   // cadmium red
  ];
  function hashStr(s){ let h = 0; for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  function avatarShade(name){ return AVATAR_SHADES[hashStr(name || "") % AVATAR_SHADES.length]; }
  function getInitials(name){
    const clean = (name||"").replace(/\([^)]*\)/g,'').replace(/^(Sir|Lady)\s+/i,'').trim();
    const parts = clean.split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function avatarHtml(p, sizeClass){
    if (p.photoUrl){
      return `<div class="avatar ${sizeClass}" style="background-image:url('${p.photoUrl}')"></div>`;
    }
    const sh = avatarShade(p.name);
    // true near-black on the light gold (not a hue-tinted brown, which reads muddy);
    // white on the dark cadmium red, where it already reads cleanly
    const fg = sh.l > 65 ? "oklch(18% 0.01 90)" : "oklch(99% 0.005 90)";
    const shadow = sh.l > 65 ? "none" : "0 1px 2px oklch(15% 0 0 / .55),0 0 1px oklch(15% 0 0 / .4)";
    return `<div class="avatar ${sizeClass}" style="background:oklch(${sh.l}% ${sh.c} ${sh.h});color:${fg};text-shadow:${shadow}">${getInitials(p.name)}</div>`;
  }

  const COL_W = 300;
  const NODE_GAP = 16;        // vertical gap between two nodes in the same sibling group
  const GROUP_GAP = 34;       // extra gap when a new sibling group (different parent) begins
  const TOP_PAD = 56;         // room for the sticky-look generation label

  function buildOrder(){
    // group siblings together (depth-first over parent links), falling back to
    // original array order for roots / orphans.
    const childrenOf = {};
    DATA.forEach(p => {
      const key = p.parent || "__root__";
      (childrenOf[key] = childrenOf[key] || []).push(p);
    });
    const order = [];
    const visited = new Set();
    function visit(p){
      if (visited.has(p.id)) return;
      visited.add(p.id);
      order.push(p);
      (childrenOf[p.id] || []).forEach(visit);
    }
    DATA.forEach(p => { if(!p.parent) visit(p); });
    DATA.forEach(p => visit(p)); // orphans / broken refs
    return order;
  }

  // ---------- render (measures real card sizes before placing them, so
  // variable-length names/dates/spouse lines never overlap) ----------
  function render(){
    const gens = [...new Set(DATA.map(p => p.gen))].sort((a,b)=>a-b);
    const colX = {};
    gens.forEach((g,i) => colX[g] = 40 + i*COL_W);
    const order = buildOrder();

    const canvas = document.getElementById("canvas");
    const svg = document.getElementById("lines");
    canvas.querySelectorAll(".node, .gen-label").forEach(el => el.remove());
    svg.innerHTML = "";

    // Pass 1: create every card (off-flow, invisible) so the browser can tell
    // us its real rendered height/width, then measure them all at once.
    const els = {};
    order.forEach(p => {
      const div = document.createElement("div");
      div.className = "node" + (p.uncertain ? " uncertain" : "") + (!p.parent ? " root" : "");
      div.style.visibility = "hidden";
      div.style.left = "0px"; div.style.top = "0px";
      div.style.borderTopColor = genColor(gens.indexOf(p.gen));
      div.dataset.id = p.id;
      const spouseNames = (p.spouses || []).map(s => s.name).filter(Boolean).join("; ");
      div.innerHTML =
        `<div class="node-row">` +
          avatarHtml(p, "avatar-sm") +
          `<div class="txt">` +
            `<div class="name">${escapeHtml(p.name)}</div>` +
            (p.dates ? `<div class="dates">${escapeHtml(p.dates)}</div>` : "") +
            (spouseNames ? `<div class="spouse">${escapeHtml(spouseNames)}</div>` : "") +
          `</div>` +
        `</div>` +
        (p.note ? `<div class="note-flag" title="Has a note — click to read">✎</div>` : "");
      div.addEventListener("click", () => openEditor(p.id));
      canvas.appendChild(div);
      els[p.id] = div;
    });
    const size = {};
    order.forEach(p => {
      const el = els[p.id];
      size[p.id] = { w: el.offsetWidth, h: el.offsetHeight };
    });

    // Pass 2: walk each generation's nodes in order, stacking them with a
    // normal gap, and a wider gap whenever the sibling group (parent) changes,
    // so families read as visually distinct clusters instead of one wall of boxes.
    const pos = {};
    gens.forEach(g => {
      let y = TOP_PAD;
      let lastParent = undefined;
      order.filter(p => p.gen === g).forEach(p => {
        if (lastParent !== undefined && p.parent !== lastParent) y += GROUP_GAP - NODE_GAP;
        const { w, h } = size[p.id];
        pos[p.id] = { x: colX[g], y, w, h, gen: g };
        y += h + NODE_GAP;
        lastParent = p.parent;
      });
    });

    const maxY = Math.max(200, ...Object.values(pos).map(v => v.y + v.h)) + 80;
    const maxX = colX[gens[gens.length-1]] + COL_W;
    canvas.style.width = maxX + "px";
    canvas.style.height = maxY + "px";
    svg.setAttribute("width", maxX);
    svg.setAttribute("height", maxY);

    // generation labels
    gens.forEach((g,i) => {
      const lbl = document.createElement("div");
      lbl.className = "gen-label";
      lbl.style.left = colX[g] + "px";
      lbl.style.background = genColor(i);
      lbl.textContent = "Generation " + g;
      canvas.appendChild(lbl);
    });

    // connector lines (drawn from each parent's true right edge/mid-height to
    // each child's true left edge/mid-height, so they always meet the cards
    // exactly regardless of card size)
    DATA.forEach(p => {
      if (!p.parent) return;
      const a = pos[p.parent], b = pos[p.id];
      if (!a || !b) return;
      const x1 = a.x + a.w, y1 = a.y + a.h/2;
      const x2 = b.x, y2 = b.y + b.h/2;
      const mid = (x1 + x2) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d", `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
      path.setAttribute("fill","none");
      const positional = p.confidence === "positional";
      const depthIdx = gens.indexOf(b.gen); // branches taper as the tree fans out into later generations
      const width = Math.max(positional ? 1.0 : 1.15, (positional ? 2.0 : 2.7) - depthIdx * 0.16);
      path.setAttribute("stroke", positional ? "var(--line-pos)" : "var(--line-clear)");
      path.setAttribute("stroke-width", width.toFixed(2));
      path.setAttribute("stroke-linecap","round");
      if (positional) path.setAttribute("stroke-dasharray","5,4");
      svg.appendChild(path);
    });

    // reveal the cards at their final, measured positions
    order.forEach(p => {
      const xy = pos[p.id];
      const el = els[p.id];
      el.style.left = xy.x + "px";
      el.style.top = xy.y + "px";
      el.style.visibility = "visible";
    });

    applyZoom();
  }

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- spouses (each spouse can carry their own name + notes) ----------
  // Older data stored a single free-text "spouse" string (sometimes several
  // names separated by ";"). migrateSpouses() converts any record still in
  // that shape into a "spouses" array the first time it's seen, so existing
  // text is never lost -- it just lands as each spouse's name, with an empty
  // notes box ready to fill in. Runs on every load path (local, imported,
  // and incoming from the shared database) so it's a no-op once everyone's
  // data has moved over.
  function migrateSpouses(arr){
    (arr || []).forEach(p => {
      if (!Array.isArray(p.spouses)) {
        const legacy = (p.spouse || "").toString();
        p.spouses = legacy
          ? legacy.split(";").map(s => s.trim()).filter(Boolean).map(name => ({name, note: ""}))
          : [];
      }
      delete p.spouse;
    });
    return arr;
  }

  function spouseRowHtml(name, note){
    return `<div class="spouseRow">
      <div class="spouseRowTop">
        <input type="text" class="sp_name" placeholder="Spouse name" value="${escapeHtml(name || "")}">
        <button type="button" class="sp_remove" title="Remove this spouse">✕</button>
      </div>
      <textarea class="sp_note" placeholder="Notes about this spouse (optional)">${escapeHtml(note || "")}</textarea>
    </div>`;
  }

  function renderSpouseRows(list){
    const wrap = document.getElementById("spouseList");
    const rows = (list && list.length) ? list : [{name:"",note:""}];
    wrap.innerHTML = rows.map(s => spouseRowHtml(s.name, s.note)).join("");
    wrap.querySelectorAll(".sp_remove").forEach(btn => {
      btn.addEventListener("click", () => {
        const allRows = wrap.querySelectorAll(".spouseRow");
        if (allRows.length <= 1) {
          // keep at least one (empty) row visible rather than leaving a gap
          btn.closest(".spouseRow").querySelector(".sp_name").value = "";
          btn.closest(".spouseRow").querySelector(".sp_note").value = "";
          return;
        }
        btn.closest(".spouseRow").remove();
      });
    });
  }

  function collectSpouseRows(){
    return Array.from(document.querySelectorAll("#spouseList .spouseRow")).map(row => ({
      name: row.querySelector(".sp_name").value.trim(),
      note: row.querySelector(".sp_note").value.trim()
    })).filter(s => s.name || s.note);
  }

  document.getElementById("btnAddSpouse").addEventListener("click", () => {
    const wrap = document.getElementById("spouseList");
    wrap.insertAdjacentHTML("beforeend", spouseRowHtml("", ""));
    const rows = wrap.querySelectorAll(".spouseRow");
    const last = rows[rows.length - 1];
    last.querySelector(".sp_remove").addEventListener("click", () => {
      const allRows = wrap.querySelectorAll(".spouseRow");
      if (allRows.length <= 1) {
        last.querySelector(".sp_name").value = "";
        last.querySelector(".sp_note").value = "";
        return;
      }
      last.remove();
    });
    last.querySelector(".sp_name").focus();
  });

  // ---------- zoom / pan ----------
  function applyZoom(){
    document.getElementById("canvas").style.transform = `scale(${scale})`;
    document.getElementById("zoomlabel").textContent = Math.round(scale*100) + "%";
  }
  document.getElementById("btnZoomIn").onclick = () => { scale = Math.min(2, scale + 0.1); applyZoom(); };
  document.getElementById("btnZoomOut").onclick = () => { scale = Math.max(0.2, scale - 0.1); applyZoom(); };
  document.getElementById("btnFit").onclick = () => {
    const wrap = document.getElementById("canvas-wrap");
    const canvas = document.getElementById("canvas");
    const sx = (wrap.clientWidth - 40) / canvas.offsetWidth;
    // On a phone-width screen, fitting the *entire* tree (10 generation columns)
    // would shrink text past legibility — floor it higher and let people pan
    // around instead of squinting at a tiny overview.
    const floor = window.innerWidth < 720 ? 0.45 : 0.15;
    scale = Math.max(floor, Math.min(1, sx));
    applyZoom();
  };

  // ---------- editor ----------
  function populateParentSelect(excludeId){
    const sel = document.getElementById("f_parent");
    sel.innerHTML = '<option value="">— none (root of chart) —</option>';
    DATA.slice().sort((a,b)=>a.gen-b.gen || a.name.localeCompare(b.name)).forEach(p => {
      if (p.id === excludeId) return;
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.name} (gen ${p.gen})`;
      sel.appendChild(opt);
    });
  }

  function openEditor(id){
    editingId = id;
    const isNew = !id;
    document.getElementById("editorTitle").textContent = isNew ? "Add person" : "Edit person";
    const p = isNew ? {name:"",gen:"",dates:"",parent:"",spouses:[],note:"",confidence:"clear",uncertain:false} : byId(id);
    populateParentSelect(id);
    document.getElementById("f_name").value = p.name || "";
    document.getElementById("f_gen").value = p.gen ?? "";
    document.getElementById("f_dates").value = p.dates || "";
    document.getElementById("f_parent").value = p.parent || "";
    renderSpouseRows(p.spouses || []);
    document.getElementById("f_note").value = p.note || "";
    document.getElementById("f_confidence").value = p.confidence || "clear";
    document.getElementById("f_uncertain").checked = !!p.uncertain;
    document.getElementById("btnDelete").style.display = isNew ? "none" : "block";
    document.getElementById("photoSection").style.display = isNew ? "none" : "block";
    document.getElementById("photoSectionNew").style.display = isNew ? "block" : "none";
    if (!isNew) updateEditorAvatarPreview(p);
    const meta = document.getElementById("editorMeta");
    if (!isNew && p.lastEditedBy) {
      meta.textContent = `Last updated by ${p.lastEditedBy}${p.lastEditedAt ? " · " + formatWhen(p.lastEditedAt) : ""}`;
      meta.style.display = "block";
    } else {
      meta.style.display = "none";
    }
    document.getElementById("overlay").style.display = "block";
    document.getElementById("editor").style.display = "flex";
  }

  function closeEditor(){
    document.getElementById("overlay").style.display = "none";
    document.getElementById("editor").style.display = "none";
    editingId = null;
  }

  // ---------- photo upload (editing person's own card only — see #photoSection) ----------
  function updateEditorAvatarPreview(p){
    document.getElementById("editorAvatarWrap").innerHTML = avatarHtml(p, "avatar-lg");
    document.getElementById("btnRemovePhoto").style.display = p.photoUrl ? "inline-flex" : "none";
  }
  function setPhotoStatus(msg, isError){
    const el = document.getElementById("photoStatus");
    el.textContent = msg || "";
    el.style.color = isError ? "var(--uncertain)" : "var(--sub2)";
  }
  document.getElementById("btnUploadPhoto").onclick = () => document.getElementById("photoInput").click();
  document.getElementById("photoInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || !editingId) return;
    if (!file.type.startsWith("image/")) { setPhotoStatus("Please choose an image file.", true); return; }
    if (file.size > 8 * 1024 * 1024) { setPhotoStatus("That image is over 8MB — please choose a smaller one.", true); return; }
    if (!window.__wftUploadPhoto) { setPhotoStatus("Photo upload isn't available right now — try again in a moment.", true); return; }
    const p = byId(editingId);
    if (!p) return;
    setPhotoStatus("Uploading…", false);
    try {
      const { url, path } = await window.__wftUploadPhoto(file, editingId);
      const oldPath = p.photoPath;
      p.photoUrl = url;
      p.photoPath = path;
      p.lastEditedBy = getEditorName();
      p.lastEditedAt = new Date().toISOString();
      persist();
      logChange("added a photo for", p.name);
      render();
      updateEditorAvatarPreview(p);
      setPhotoStatus("Photo updated.", false);
      if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
    } catch (err) {
      console.warn("[Wong Family Tree] Photo upload failed:", err);
      setPhotoStatus("Upload failed — check your connection and try again.", true);
    }
  });
  document.getElementById("btnRemovePhoto").onclick = () => {
    if (!editingId) return;
    const p = byId(editingId);
    if (!p || !p.photoUrl) return;
    if (!confirm(`Remove ${p.name}'s photo?`)) return;
    const oldPath = p.photoPath;
    delete p.photoUrl;
    delete p.photoPath;
    p.lastEditedBy = getEditorName();
    p.lastEditedAt = new Date().toISOString();
    persist();
    logChange("removed the photo for", p.name);
    render();
    updateEditorAvatarPreview(p);
    setPhotoStatus("Photo removed.", false);
    if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
  };

  document.getElementById("f_parent").addEventListener("change", (e) => {
    const parentId = e.target.value;
    const genField = document.getElementById("f_gen");
    if (parentId) {
      const parent = byId(parentId);
      if (parent && !genField.value) genField.value = parent.gen + 1;
      else if (parent) genField.value = parent.gen + 1;
    }
  });

  document.getElementById("btnCancel").onclick = closeEditor;
  document.getElementById("overlay").onclick = closeEditor;

  document.getElementById("btnSave").onclick = () => {
    const name = document.getElementById("f_name").value.trim();
    if (!name) { alert("Please enter a name."); return; }
    const gen = parseInt(document.getElementById("f_gen").value, 10);
    if (isNaN(gen)) { alert("Please enter a generation number."); return; }
    const wasNew = !editingId;
    // read the photo fields fresh off DATA (not off the form, which has no photo
    // fields) so a photo uploaded/removed earlier in this same editor session —
    // that flow persists immediately, independent of Save — is never lost here
    const existing = editingId ? byId(editingId) : null;
    const rec = {
      id: editingId || newId(),
      name,
      gen,
      dates: document.getElementById("f_dates").value.trim(),
      parent: document.getElementById("f_parent").value || null,
      spouses: collectSpouseRows(),
      note: document.getElementById("f_note").value.trim(),
      confidence: document.getElementById("f_confidence").value,
      uncertain: document.getElementById("f_uncertain").checked,
      lastEditedBy: getEditorName(),
      lastEditedAt: new Date().toISOString()
    };
    if (existing && existing.photoUrl) { rec.photoUrl = existing.photoUrl; rec.photoPath = existing.photoPath; }
    if (rec.parent === rec.id) { alert("A person can't be their own parent."); return; }
    if (editingId) {
      const idx = DATA.findIndex(p => p.id === editingId);
      DATA[idx] = rec;
    } else {
      DATA.push(rec);
    }
    persist();
    logChange(wasNew ? "added" : "edited", rec.name);
    render();
    closeEditor();
  };

  document.getElementById("btnDelete").onclick = () => {
    if (!editingId) return;
    const children = DATA.filter(p => p.parent === editingId);
    if (children.length > 0) {
      const ok = confirm(`${children.length} people are linked to this person as their parent. Delete anyway and re-link them to this person's own parent?`);
      if (!ok) return;
      const rec = byId(editingId);
      children.forEach(c => c.parent = rec.parent || null);
    }
    const deletedName = (byId(editingId) || {}).name || "someone";
    DATA = DATA.filter(p => p.id !== editingId);
    persist();
    logChange("deleted", deletedName);
    render();
    closeEditor();
  };

  document.getElementById("btnAdd").onclick = () => openEditor(null);

  // ---------- search ----------
  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".node").forEach(n => n.classList.remove("highlight"));
    if (!q) return;
    const match = DATA.find(p => p.name.toLowerCase().includes(q));
    if (match) {
      const el = document.querySelector(`.node[data-id="${match.id}"]`);
      if (el) {
        el.classList.add("highlight");
        el.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
      }
    }
  });

  // ---------- import / export ----------
  document.getElementById("btnExportJSON").onclick = () => {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "wong-family-tree-data.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  document.getElementById("btnImportJSON").onclick = () => document.getElementById("fileimport").click();
  document.getElementById("fileimport").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported)) throw new Error("not an array");
        DATA = migrateSpouses(imported);
        persist();
        render();
        alert("Imported " + DATA.length + " people.");
      } catch(err) {
        alert("Could not read that file as family tree JSON: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("btnExportHTML").onclick = () => {
    persist(); // make sure the embedded script tag matches live DATA
    const clone = document.documentElement.cloneNode(true);
    // close any open editor state in the exported copy
    clone.querySelector("#overlay").style.display = "none";
    clone.querySelector("#editor").style.display = "none";
    const html = "<!DOCTYPE html>\n" + clone.outerHTML;
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "wong-family-tree.html";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  // ---------- fullscreen ----------
  const appEl = document.getElementById("app");
  document.getElementById("btnFullscreen").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (appEl.requestFullscreen) appEl.requestFullscreen();
  };
  document.addEventListener("fullscreenchange", () => {
    document.getElementById("btnFullscreen").textContent = document.fullscreenElement ? "⤢" : "⛶";
    setTimeout(() => document.getElementById("btnFit").click(), 60);
  });

  // ---------- theme ----------
  const THEME_KEY = "wong-family-tree-theme";
  function applyTheme(t){
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    document.getElementById("btnTheme").textContent = (t === "dark") ? "☀️" : "🌙";
  }
  document.getElementById("btnTheme").onclick = () => {
    const current = document.documentElement.getAttribute("data-theme")
      || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  };
  applyTheme(localStorage.getItem(THEME_KEY));

  // ---------- live shared sync (Firebase Realtime Database) ----------
  // The module script below (loaded separately, since Firebase only ships as
  // an ES module from the CDN) fills these two slots in once it connects:
  //   __wftPushData(data)   -> write this browser's data up to the shared DB
  // and calls these two, which we define here:
  //   __wftGetCurrentData() -> hand back whatever this browser currently has,
  //                            used once to seed the DB the very first time
  //                            it's ever empty
  //   __wftOnRemoteData(d)  -> called whenever the shared DB's data changes,
  //                            including changes made by someone else
  // If the module never loads or never connects (offline, blocked network,
  // no Firebase project configured), none of this fires and the tool works
  // exactly as it always has, off localStorage + the embedded data below.
  window.__wftGetCurrentData = function(){ return DATA; };
  window.__wftOnRemoteData = function(remote){
    if (!Array.isArray(remote) || !remote.length) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(DATA)) return; // nothing actually changed
    DATA = migrateSpouses(remote);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    document.getElementById("family-data-store").textContent = JSON.stringify(DATA, null, 1);
    localStorage.setItem(BASELINE_KEY, document.getElementById("family-data-store").textContent);
    render();
  };
  // Same idea, one level down: the activity log syncs on its own path so
  // everyone's "who changed what" feed matches, same as the tree data does.
  window.__wftGetCurrentLog = function(){ return CHANGELOG; };
  window.__wftOnRemoteLog = function(remote){
    if (!Array.isArray(remote)) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(CHANGELOG)) return;
    CHANGELOG = remote;
    localStorage.setItem(CHANGELOG_KEY, JSON.stringify(CHANGELOG));
    renderActivityLog();
  };

  // ---------- init ----------
  DATA = migrateSpouses(loadData());
  CHANGELOG = loadChangelog();
  render();
  renderActivityLog();
  window.addEventListener("resize", () => {});
  setTimeout(() => document.getElementById("btnFit").click(), 50);
})();
</script>

<script type="module">
  // ---------- Firebase Realtime Database: live multi-user sync ----------
  // This talks to a shared database so every open copy of this page (any
  // computer, any browser) sees the same family-tree data and stays in
  // sync automatically. It is entirely additive: if this fails to load or
  // connect for any reason, the page falls back to the local-only behavior
  // it always had (see the plain <script> block above).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAWiPSyvdPoU8-LH0C3j8IZY7qHn19gXuw",
    authDomain: "wong-family-tree.firebaseapp.com",
    databaseURL: "https://wong-family-tree-default-rtdb.firebaseio.com",
    projectId: "wong-family-tree",
    storageBucket: "wong-family-tree.firebasestorage.app",
    messagingSenderId: "482850066709",
    appId: "1:482850066709:web:19e189598e1173b6f5991c"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "wongFamilyTree");
    const logRef = ref(db, "wongFamilyTreeLog");
    const storage = getStorage(app);

    // ---------- photo uploads (Firebase Storage) ----------
    // Anyone with the page open can upload a photo for anyone else — there's no
    // login system here, by design (most of the people in this tree can't upload
    // their own photo; a living relative uploading an old photo of an ancestor is
    // the whole point). Storage's own security rules are what actually keep this
    // to images under a sane size — see the setup notes delivered alongside this file.
    window.__wftUploadPhoto = async function(file, personId){
      const path = `photos/${personId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9_.-]/g,"_")}`;
      const r = storageRef(storage, path);
      await uploadBytes(r, file, { contentType: file.type });
      const url = await getDownloadURL(r);
      return { url, path };
    };
    window.__wftDeletePhoto = async function(path){
      // Best-effort cleanup of the previous photo when it's replaced or removed —
      // never blocks the UI and never surfaces an error if it fails.
      try { await deleteObject(storageRef(storage, path)); }
      catch (err) { console.warn("[Wong Family Tree] Could not delete old photo (leaving it in Storage):", err); }
    };

    window.__wftPushData = function(data){
      set(dataRef, data).catch(err => console.warn("[Wong Family Tree] Could not save to the shared database:", err));
    };
    window.__wftPushLog = function(log){
      set(logRef, log).catch(err => console.warn("[Wong Family Tree] Could not save the activity log:", err));
    };

    onValue(dataRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        // Shared database is empty (first time it's ever been used) -- seed
        // it with whatever this page currently has, so everyone else who
        // opens it from now on sees real data instead of nothing.
        if (window.__wftGetCurrentData) window.__wftPushData(window.__wftGetCurrentData());
        return;
      }
      if (window.__wftOnRemoteData) window.__wftOnRemoteData(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Live sync listener error (running in local-only mode):", err);
    });

    onValue(logRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        if (window.__wftGetCurrentLog) window.__wftPushLog(window.__wftGetCurrentLog());
        return;
      }
      if (window.__wftOnRemoteLog) window.__wftOnRemoteLog(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Activity log sync error (running in local-only mode):", err);
    });

    console.log("[Wong Family Tree] Connected to the shared live database.");
  } catch (err) {
    console.warn("[Wong Family Tree] Live sync unavailable, running in local-only mode:", err);
  }
</script>
