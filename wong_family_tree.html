<script>
(function(){
  "use strict";

  const STORAGE_KEY = "wong-family-tree-data-v1";
  const BASELINE_KEY = "wong-family-tree-baseline-v1";
  const CHANGELOG_KEY = "wong-family-tree-changelog-v1";
  const GUESTBOOK_KEY = "wong-family-tree-guestbook-v1";
  const EDITOR_NAME_KEY = "wong-family-tree-editor-name";
  const MAX_LOG_ENTRIES = 300;
  const MAX_GUESTBOOK_ENTRIES = 500;
  let DATA = [];
  let CHANGELOG = [];
  let GUESTBOOK = [];
  let editingId = null; // null while adding a new person

  // A visitor's browser only ever sees a NEW publish of this file if the file's
  // own embedded data differs from whatever this browser saw last time — so we
  // keep a copy of the exact embedded text alongside the working copy in
  // localStorage. Unchanged file -> trust localStorage (it may hold this
  // browser's own in-progress edits). Changed file -> the fresh publish wins,
  // and becomes the new baseline. Without this, re-uploading an updated export
  // would silently never reach anyone who had visited the page before, since
  // their old cached copy would keep winning forever.
  function loadData(){
    const embeddedText = document.getElementById("family-data-store").textContent;
    const storedBaseline = localStorage.getItem(BASELINE_KEY);
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && storedBaseline === embeddedText) {
      try { return JSON.parse(saved); } catch(e){ /* fall through */ }
    }
    const fresh = JSON.parse(embeddedText);
    localStorage.setItem(BASELINE_KEY, embeddedText);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }

  function persist(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    // keep the embedded script tag in sync so "Export updated page" always
    // captures the live data, regardless of where it originally came from.
    document.getElementById("family-data-store").textContent = JSON.stringify(DATA, null, 1);
    // push to the shared live database, if the sync layer below managed to
    // connect. If it never connected (offline, blocked network, no config),
    // this is a no-op and everything behaves exactly like local-only mode.
    if (window.__wftPushData) window.__wftPushData(DATA);
  }

  // ---------- "who's editing" + activity log ----------
  // No login here -- just a one-time, name-only nudge so edits can carry an
  // attribution and show up in a simple activity feed. Remembered per
  // browser, not verified or enforced (same trust level as the rest of the
  // shared-edit setup).
  function getEditorName(){
    let name = (localStorage.getItem(EDITOR_NAME_KEY) || "").trim();
    if (!name) {
      name = (window.prompt("Quick one-time question -- what's your name? It'll be attached to edits you make, so the family can see who updated what.", "") || "").trim();
      if (name) localStorage.setItem(EDITOR_NAME_KEY, name);
    }
    return name || "Someone";
  }

  function loadChangelog(){
    try {
      const saved = JSON.parse(localStorage.getItem(CHANGELOG_KEY));
      return Array.isArray(saved) ? saved : [];
    } catch(e){ return []; }
  }

  function logChange(action, personName){
    CHANGELOG.push({ by: getEditorName(), action, personName, at: new Date().toISOString() });
    if (CHANGELOG.length > MAX_LOG_ENTRIES) CHANGELOG = CHANGELOG.slice(-MAX_LOG_ENTRIES);
    localStorage.setItem(CHANGELOG_KEY, JSON.stringify(CHANGELOG));
    if (window.__wftPushLog) window.__wftPushLog(CHANGELOG);
    renderActivityLog();
  }

  // Full date + time, since this now sits on the page permanently rather
  // than in a popup someone opens right after making the edit.
  function formatWhen(iso){
    try {
      return new Date(iso).toLocaleString(undefined, { year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
    } catch(e){ return ""; }
  }

  function renderActivityLog(){
    const list = document.getElementById("activityList");
    if (!list) return;
    if (!CHANGELOG.length) {
      list.innerHTML = '<div class="empty">No edits logged yet. Once someone adds, edits, or deletes a person, it\'ll show up here.</div>';
      return;
    }
    list.innerHTML = CHANGELOG.slice().reverse().map(entry => {
      const verb = entry.action === "added" ? "added" : entry.action === "deleted" ? "deleted" : "edited";
      return `<div class="log-entry">` +
        `<div class="what"><span class="who">${escapeHtml(entry.by)}</span> ${verb} <span class="person">${escapeHtml(entry.personName)}</span></div>` +
        `<div class="when">${escapeHtml(formatWhen(entry.at))}</div>` +
        `</div>`;
    }).join("");
  }

  // ---------- family guestbook (one shared board, open to anyone — same
  // no-login trust model as the rest of this tool) ----------
  function loadGuestbook(){
    try {
      const saved = JSON.parse(localStorage.getItem(GUESTBOOK_KEY));
      return Array.isArray(saved) ? saved : [];
    } catch(e){ return []; }
  }

  function postGuestbookEntry(message){
    GUESTBOOK.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2),
      by: getEditorName(),
      message,
      at: new Date().toISOString()
    });
    if (GUESTBOOK.length > MAX_GUESTBOOK_ENTRIES) GUESTBOOK = GUESTBOOK.slice(-MAX_GUESTBOOK_ENTRIES);
    localStorage.setItem(GUESTBOOK_KEY, JSON.stringify(GUESTBOOK));
    if (window.__wftPushGuestbook) window.__wftPushGuestbook(GUESTBOOK);
    renderGuestbook();
  }

  function removeGuestbookEntry(id){
    GUESTBOOK = GUESTBOOK.filter(e => e.id !== id);
    localStorage.setItem(GUESTBOOK_KEY, JSON.stringify(GUESTBOOK));
    if (window.__wftPushGuestbook) window.__wftPushGuestbook(GUESTBOOK);
    renderGuestbook();
  }

  const GUESTBOOK_PAGE_SIZE = 10;
  let guestbookShown = GUESTBOOK_PAGE_SIZE;

  function renderGuestbook(){
    const list = document.getElementById("guestbookList");
    if (!list) return;
    if (!GUESTBOOK.length) {
      list.innerHTML = '<div class="empty">No messages yet — be the first to leave a note for the family.</div>';
      return;
    }
    const ordered = GUESTBOOK.slice().reverse();
    const visible = ordered.slice(0, guestbookShown);
    list.innerHTML = visible.map(entry => `
      <div class="gb-entry">
        <div class="gb-top"><span class="who">${escapeHtml(entry.by)}</span><span class="when">${escapeHtml(formatWhen(entry.at))}</span></div>
        <div class="gb-msg">${escapeHtml(entry.message)}</div>
        <span class="gb-remove" data-id="${entry.id}">remove</span>
      </div>`).join("")
      + (ordered.length > visible.length ? `<div class="gb-more"><span id="btnMoreGuestbook">View more (${ordered.length - visible.length} older)</span></div>` : "");
    list.querySelectorAll(".gb-remove").forEach(el => {
      el.addEventListener("click", () => {
        if (confirm("Remove this message from the guestbook?")) removeGuestbookEntry(el.dataset.id);
      });
    });
    const moreBtn = document.getElementById("btnMoreGuestbook");
    if (moreBtn) moreBtn.addEventListener("click", () => {
      guestbookShown += GUESTBOOK_PAGE_SIZE;
      renderGuestbook();
    });
  }

  document.getElementById("btnPostGuestbook").onclick = () => {
    const ta = document.getElementById("gb_message");
    const message = ta.value.trim();
    if (!message) return;
    postGuestbookEntry(message);
    ta.value = "";
  };

  function byId(id){ return DATA.find(p => p.id === id); }

  function newId(){
    let n = DATA.length + 1;
    while (byId("p" + n)) n++;
    return "p" + n;
  }

  // Spouses live inside their partner's own record, not as top-level DATA
  // entries, so they get their own lightweight id scheme -- just needs to be
  // stable and unique enough to key a photo-upload storage path and a DOM row.
  function newSpouseId(){
    return "sp" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ---------- photo avatars ----------
  // Colored-initials avatar by default; a real uploaded photo (person.photoUrl) takes
  // over the same slot automatically. Exactly one gold, one red -- and the color is
  // meaningful, not decorative: gold marks someone whose line continues (they have
  // recorded children), red marks a line that ends there. Spouses have no children
  // recorded under their own id (kids always attach to the blood-line person), so
  // they read red by the same rule -- not a special case, just how the data works.
  const AVATAR_SHADES = [
    {l:82, c:0.15,  h:95},  // gold (true yellow-gold — 黃 Wong means gold/yellow) — has children
    {l:53, c:0.235, h:27}   // cadmium red — no recorded children
  ];
  function avatarShade(p){
    const hasChildren = !!(p && p.id && kids(p.id).length > 0);
    return AVATAR_SHADES[hasChildren ? 0 : 1];
  }
  function getInitials(name){
    const clean = (name||"").replace(/\([^)]*\)/g,'').replace(/^(Sir|Lady)\s+/i,'').trim();
    const parts = clean.split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function avatarHtml(p, sizeClass){
    if (p.photoUrl){
      return `<div class="avatar ${sizeClass}" style="background-image:url('${p.photoUrl}')"></div>`;
    }
    const sh = avatarShade(p);
    // true near-black on the light gold (not a hue-tinted brown, which reads muddy);
    // white on the dark cadmium red, where it already reads cleanly
    const fg = sh.l > 65 ? "oklch(18% 0.01 90)" : "oklch(99% 0.005 90)";
    const shadow = sh.l > 65 ? "none" : "0 1px 2px oklch(15% 0 0 / .55),0 0 1px oklch(15% 0 0 / .4)";
    return `<div class="avatar ${sizeClass}" style="background:oklch(${sh.l}% ${sh.c} ${sh.h});color:${fg};text-shadow:${shadow}">${getInitials(p.name)}</div>`;
  }

  const ICON = {
    spouse: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>',
    note:   '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h9M8 13h9M8 17h5"/></svg>',
    layers: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/></svg>',
    chevUp: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l7-7 7 7" opacity=".45"/><path d="M5 11l7-7 7 7"/></svg>',
    chevDown:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l7 7 7-7" opacity=".45"/><path d="M5 13l7 7 7-7"/></svg>',
    people: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 20c.3-2.7 1.8-4.6 4-4.9"/></svg>',
    dash:   '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
    chevron:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    camera: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
    pencil: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
  };

  // ---------- Focus View: one person at a time, click any relative to re-center ----------
  function kids(id){ return DATA.filter(p => (p.parent || null) === id); }
  function ancestorsOf(id){
    const chain = []; let cur = byId(id);
    while (cur && cur.parent && byId(cur.parent)) { chain.push(cur.parent); cur = byId(cur.parent); }
    return chain;
  }

  function cardHtml(p, extraClass){
    const cls = "card " + (extraClass||"") + (p.uncertain ? " uncertain" : "");
    return `<div class="${cls}" data-id="${p.id}">
      ${avatarHtml(p, "avatar-sm")}
      <div class="txt">
        <div class="name">${escapeHtml(p.name)}</div>
        ${p.dates ? `<div class="dates">${escapeHtml(p.dates)}</div>` : ""}
      </div>
    </div>`;
  }

  function ancestorTier(p, cls, label){
    if (!p) return "";
    return `<div class="tierLabel">${ICON.chevUp}${label}</div><div class="tier ${cls}">${cardHtml(p)}</div><div class="vline"></div>`;
  }

  // the larger, feathered "cameo portrait" that surfaces top-right on tap
  let bigPortraitOpen = false;
  function updateBigPortrait(p){
    const bp = document.getElementById("bigPortrait");
    if (p.photoUrl){
      bp.style.backgroundImage = `url('${p.photoUrl}')`;
      bp.style.color = "transparent";
      bp.textContent = "";
    } else {
      const sh = avatarShade(p);
      bp.style.backgroundImage = `linear-gradient(160deg, oklch(${Math.min(96,sh.l+6)}% ${sh.c*0.9} ${sh.h}), oklch(${Math.max(20,sh.l-10)}% ${sh.c} ${sh.h}))`;
      bp.style.color = sh.l > 65 ? "oklch(18% 0.01 90)" : "oklch(99% 0.005 90)";
      bp.style.textShadow = sh.l > 65 ? "none" : "0 2px 4px oklch(15% 0 0 / .55),0 0 2px oklch(15% 0 0 / .4)";
      bp.textContent = getInitials(p.name);
    }
  }
  function toggleBigPortrait(p){
    const bp = document.getElementById("bigPortrait");
    const backing = document.getElementById("bigPortraitBacking");
    bigPortraitOpen = !bigPortraitOpen;
    if (bigPortraitOpen){
      updateBigPortrait(p);
      bp.classList.add("show"); backing.classList.add("show");
      bp.onclick = () => toggleBigPortrait(p);
    } else {
      bp.classList.remove("show"); backing.classList.remove("show");
      bp.onclick = null;
    }
  }
  function closeBigPortrait(){
    bigPortraitOpen = false;
    document.getElementById("bigPortrait").classList.remove("show");
    document.getElementById("bigPortraitBacking").classList.remove("show");
  }
  document.addEventListener("click", (e) => {
    if (!bigPortraitOpen) return;
    if (e.target.closest("#bigPortrait") || e.target.closest(".avatar-lg-wrap")) return;
    closeBigPortrait();
  });

  let currentId = null;

  function render(id){
    if (!id || !byId(id)) {
      const roots = DATA.filter(p => !p.parent);
      id = (roots[0] || DATA[0] || {}).id;
      if (!id) return; // no data at all
    }
    currentId = id;
    const p = byId(id);
    const stage = document.getElementById("stage");
    stage.style.opacity = "0";

    const parentId = ancestorsOf(id)[0];
    const parent = parentId ? byId(parentId) : null;
    const grandId = parent ? ancestorsOf(parent.id)[0] : null;
    const grand = grandId ? byId(grandId) : null;
    const greatGrandId = grand ? ancestorsOf(grand.id)[0] : null;
    const greatGrand = greatGrandId ? byId(greatGrandId) : null;
    const siblings = parent ? kids(parent.id).filter(s => s.id !== p.id) : [];
    const children = kids(p.id);
    const spouses = (Array.isArray(p.spouses) ? p.spouses : [])
      .map(s => ({id:s.id, name:(s.name||"").trim(), note:(s.note||"").trim(), photoUrl:s.photoUrl})).filter(s=>s.name);

    let html = "";
    html += ancestorTier(greatGrand, "tier-anc-1", "Great-grandparent");
    html += ancestorTier(grand, "tier-anc-2", "Grandparent");
    html += ancestorTier(parent, "tier-anc-3", "Parent");

    html += `<div id="focusRow">`;
    if (siblings.length){
      html += `<div id="siblingsCol"><div class="sibLabel">${ICON.people}${siblings.length} sibling${siblings.length===1?"":"s"}</div>` +
        siblings.map(s => `<div class="sib-card${s.uncertain?" uncertain":""}" data-id="${s.id}">${avatarHtml(s,"avatar-xs")}<span>${escapeHtml(s.name)}</span></div>`).join("") + `</div>`;
    } else { html += `<div style="width:1px"></div>`; }

    html += `<div id="focusCard">`;
    html += `<div class="editBadge" title="Edit ${escapeHtml(p.name)}">${ICON.pencil}</div>`;
    if (p.uncertain) html += `<div class="uncertainBadge">?</div>`;
    html += `<div class="avatar-lg-wrap">${avatarHtml(p,"avatar-lg")}<div class="addPhoto" title="Add/edit photo">${ICON.camera}</div></div>`;
    html += `<div class="gen">${ICON.layers}Generation ${p.gen}</div>`;
    html += `<div class="name">${escapeHtml(p.name)}</div>`;
    if (p.dates) html += `<div class="dates">${escapeHtml(p.dates)}</div>`;
    if (p.note) html += `<div class="note">${ICON.note}<span>${escapeHtml(p.note)}</span></div>`;
    html += `<div class="cardSeal">黃</div>`;
    html += `</div>`;

    if (spouses.length){
      html += `<div id="spouseCards">` + spouses.map(s => {
        const nd = splitNameDates(s.name);
        return `<div class="spouse-card"${s.photoUrl?' data-spouse-photo="1"':''} data-spouse-id="${s.id||''}" data-spouse-name="${escapeHtml(s.name)}" data-spouse-photo-url="${s.photoUrl?escapeHtml(s.photoUrl):''}">${avatarHtml({name:s.name, photoUrl:s.photoUrl},"avatar-sm")}<div><span>${escapeHtml(nd.name)}</span>${nd.dates?`<div class="spouse-dates">${escapeHtml(nd.dates)}</div>`:""}${s.note?`<div class="spouse-note">${escapeHtml(s.note)}</div>`:""}</div><div class="spouseEditBadge" title="Edit ${escapeHtml(s.name)}">${ICON.pencil}</div></div>`;
      }).join("") + `</div>`;
    } else { html += `<div style="width:1px"></div>`; }
    html += `</div>`; // #focusRow

    if (children.length){
      html += `<div class="vline"></div>`;
      html += `<div class="tierLabel">${ICON.chevDown}Children (${children.length})</div>`;
      html += `<div id="descendantsOuter"><div id="descendantsWrap">` + children.map(c => {
        const gkids = kids(c.id);
        let group = `<div class="childGroup">${cardHtml(c, "child-card")}`;
        if (gkids.length){
          group += `<div class="mini-vline"></div><div class="gkidsRow">` +
            gkids.map(g => `<div class="gkid-chip${g.uncertain?" uncertain":""}" data-id="${g.id}">${avatarHtml(g,"avatar-xs")}<span>${escapeHtml(g.name)}</span></div>`).join("") + `</div>`;
        }
        group += `</div>`;
        return group;
      }).join("") + `</div></div>`;
    } else {
      html += `<div class="vline"></div><div id="noChildren">${ICON.dash}No recorded children</div>`;
    }

    stage.innerHTML = html;
    requestAnimationFrame(() => { stage.style.transition = "opacity .22s ease"; stage.style.opacity = "1"; });

    stage.querySelectorAll("[data-id]").forEach(el => {
      el.addEventListener("click", () => render(el.dataset.id));
    });
    stage.scrollTop = 0;
    const dw = document.getElementById("descendantsWrap");
    if (dw) dw.scrollLeft = Math.max(0, (dw.scrollWidth - dw.clientWidth) / 2);

    // navigating away from a person always closes their portrait
    closeBigPortrait();
    const wrap = stage.querySelector(".avatar-lg-wrap");
    if (wrap){
      wrap.addEventListener("click", (e) => {
        if (e.target.closest(".addPhoto")) return; // that icon has its own job (below)
        toggleBigPortrait(p);
      });
    }
    const addPhotoBtn = stage.querySelector(".addPhoto");
    if (addPhotoBtn) addPhotoBtn.addEventListener("click", (e) => { e.stopPropagation(); openEditor(p.id); });
    const editBadge = stage.querySelector(".editBadge");
    if (editBadge) editBadge.addEventListener("click", (e) => { e.stopPropagation(); openEditor(p.id); });
    // tapping a spouse card always shows their portrait bigger -- same cameo
    // the main person gets, complete with the same initials-on-gradient
    // fallback when they don't have a photo yet (see updateBigPortrait) --
    // so the card is never a dead end even before a photo exists. The small
    // pencil badge is the dedicated way into the editor's Spouse(s) section
    // to actually add/change that photo, mirroring the main person's own
    // editBadge + avatar-lg-wrap split.
    stage.querySelectorAll('.spouse-card').forEach(card => {
      card.addEventListener("click", (e) => {
        e.stopPropagation();
        if (e.target.closest(".spouseEditBadge")) return; // that icon has its own job (below)
        toggleBigPortrait({ name: card.dataset.spouseName, photoUrl: card.dataset.spousePhotoUrl });
      });
      const badge = card.querySelector(".spouseEditBadge");
      if (badge){
        badge.addEventListener("click", (e) => {
          e.stopPropagation();
          openEditor(p.id);
          const spouseId = card.dataset.spouseId;
          if (!spouseId) return;
          requestAnimationFrame(() => {
            const row = document.querySelector(`#spouseList .spouseRow[data-id="${spouseId}"]`);
            if (!row) return;
            row.scrollIntoView({ block: "center" });
            row.style.transition = "background .3s";
            row.style.background = "var(--accent-soft)";
            setTimeout(() => { row.style.background = ""; }, 900);
          });
        });
      }
    });

    renderBreadcrumb(id);
  }

  function renderBreadcrumb(id){
    const chain = ancestorsOf(id).reverse().concat([id]); // root -> ... -> self
    let shown = chain;
    if (chain.length > 6) { shown = [chain[0], chain[1], "…", chain[chain.length-2], chain[chain.length-1]]; }
    const bc = document.getElementById("breadcrumb");
    bc.innerHTML = shown.map((cid,i) => {
      const isLast = i === shown.length-1;
      if (cid === "…") return `<span class="dots">···</span>`;
      const person = byId(cid);
      if (!person) return "";
      const name = escapeHtml(person.name);
      const icon = i === 0 ? `<span class="miniSeal">黃</span>` : "";
      const sep = isLast ? "" : `<span class="sep">${ICON.chevron}</span>`;
      return (isLast ? `<span class="current">${name}</span>` : `<span class="crumb" data-id="${cid}">${icon}${name}</span>`) + sep;
    }).join("");
    bc.querySelectorAll(".crumb").forEach(el => el.addEventListener("click", () => render(el.dataset.id)));
  }

  // ---------- search (jump to a person, doesn't just highlight) ----------
  const searchInput = document.getElementById("search");
  const resultsBox = document.getElementById("searchResults");
  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { resultsBox.style.display = "none"; return; }
    const matches = DATA.filter(p => p.name.toLowerCase().includes(q)).slice(0, 12);
    if (!matches.length) { resultsBox.style.display = "none"; return; }
    resultsBox.innerHTML = matches.map(p => `<div class="res" data-id="${p.id}"><span class="rn">${escapeHtml(p.name)}</span><span class="g">Gen. ${p.gen}</span></div>`).join("");
    resultsBox.style.display = "block";
    resultsBox.querySelectorAll(".res").forEach(el => el.addEventListener("click", () => {
      render(el.dataset.id); resultsBox.style.display = "none"; searchInput.value = "";
    }));
  });
  document.addEventListener("click", (e) => { if (!e.target.closest("#searchWrap")) resultsBox.style.display = "none"; });

  // ---------- "start from the top" ----------
  document.getElementById("btnRoot").addEventListener("click", () => {
    const roots = DATA.filter(p => !p.parent);
    if (roots[0]) render(roots[0].id);
  });

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // Spouses don't have their own "dates" field like the main person does --
  // people just type a trailing "1912-1995" (or "b. 1912", or "1912-" for
  // still-living) right into the name field. Splits that off so it always
  // renders on its own line underneath the name (same as the main person's
  // separate name/.dates rows), never sharing a line with the name and
  // never breaking in the middle of the range itself.
  function splitNameDates(name){
    const raw = String(name || "");
    const m = raw.match(/^(.*?)\s+((?:b\.\s*)?\d{3,4}\s*[-–—]\s*\d{0,4})$/);
    if (!m) return { name: raw, dates: "" };
    return { name: m[1], dates: m[2] };
  }

  // ---------- spouses (each spouse can carry their own name + notes) ----------
  // Older data stored a single free-text "spouse" string (sometimes several
  // names separated by ";"). migrateSpouses() converts any record still in
  // that shape into a "spouses" array the first time it's seen, so existing
  // text is never lost -- it just lands as each spouse's name, with an empty
  // notes box ready to fill in. Runs on every load path (local, imported,
  // and incoming from the shared database) so it's a no-op once everyone's
  // data has moved over.
  function migrateSpouses(arr){
    (arr || []).forEach(p => {
      if (!Array.isArray(p.spouses)) {
        const legacy = (p.spouse || "").toString();
        p.spouses = legacy
          ? legacy.split(";").map(s => s.trim()).filter(Boolean).map(name => ({name, note: ""}))
          : [];
      }
      delete p.spouse;
      // Backfill a stable id on any spouse that predates photo-upload support
      // (or just got migrated above) -- same one-time, idempotent shape as
      // the legacy-string migration itself.
      p.spouses.forEach(s => { if (!s.id) s.id = newSpouseId(); });
    });
    return arr;
  }

  // A spouse can only get a photo-upload slot once they have a stable id --
  // i.e. once they've been saved at least once, same "save first" rule the
  // main person's own photo already follows (see #photoSectionNew above).
  // Rendered as its own labeled strip (avatar + "Add photo"/"Change photo"/
  // "Remove photo" buttons), not a tiny icon easy to miss next to their name.
  function spousePhotoRowHtml(s){
    s = s || {};
    const av = avatarHtml({name:s.name || "", photoUrl:s.photoUrl}, "avatar-md");
    if (!s.id){
      return `<div class="spPhotoRow">
        <div class="spAvatarWrap">${av}</div>
        <div class="spPhotoHint">Save this spouse first, then come back to add a photo</div>
      </div>`;
    }
    return `<div class="spPhotoRow">
      <div class="spAvatarWrap">
        ${av}
        <input type="file" class="sp_photo_input" accept="image/*" style="display:none;">
      </div>
      <div class="spPhotoActions">
        <button type="button" class="sp_photo_upload">${ICON.camera} ${s.photoUrl ? "Change photo" : "Add photo"}</button>
        ${s.photoUrl ? `<button type="button" class="sp_photo_remove">Remove photo</button>` : ""}
      </div>
    </div>`;
  }

  function spouseRowHtml(s){
    s = s || {};
    return `<div class="spouseRow" data-id="${s.id || ""}">
      ${spousePhotoRowHtml(s)}
      <div class="spouseRowTop">
        <input type="text" class="sp_name" placeholder="Spouse name" value="${escapeHtml(s.name || "")}">
        <button type="button" class="sp_remove" title="Remove this spouse">✕</button>
      </div>
      <textarea class="sp_note" placeholder="Notes about this spouse (optional)">${escapeHtml(s.note || "")}</textarea>
    </div>`;
  }

  function wireSpouseRemove(row){
    row.querySelector(".sp_remove").addEventListener("click", () => {
      const wrap = document.getElementById("spouseList");
      const allRows = wrap.querySelectorAll(".spouseRow");
      if (allRows.length <= 1) {
        // keep at least one (empty) row visible rather than leaving a gap
        row.querySelector(".sp_name").value = "";
        row.querySelector(".sp_note").value = "";
        return;
      }
      row.remove();
    });
  }

  // Mirrors the main person's own upload/remove flow (see "photo upload"
  // below): mutates the live DATA record directly and persists right away,
  // independent of the editor's own Save button, so it's never lost.
  function wireSpousePhotoControls(row){
    const uploadBtn = row.querySelector(".sp_photo_upload");
    const fileInput = row.querySelector(".sp_photo_input");
    const removeBtn = row.querySelector(".sp_photo_remove");
    const refreshRowAvatar = (spouse) => {
      const slot = row.querySelector(".spPhotoRow");
      if (slot) slot.outerHTML = spousePhotoRowHtml(spouse);
      wireSpousePhotoControls(row);
    };
    if (uploadBtn && fileInput){
      uploadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        const spouseId = row.dataset.id;
        if (!file || !editingId || !spouseId) return;
        if (!file.type.startsWith("image/")) { alert("Please choose an image file."); return; }
        if (file.size > 8 * 1024 * 1024) { alert("That image is over 8MB — please choose a smaller one."); return; }
        if (!window.__wftUploadPhoto) { alert("Photo upload isn't available right now — try again in a moment."); return; }
        const p = byId(editingId);
        const spouse = p && Array.isArray(p.spouses) ? p.spouses.find(sp => sp.id === spouseId) : null;
        if (!spouse) return;
        try {
          const { url, path } = await window.__wftUploadPhoto(file, spouseId);
          const oldPath = spouse.photoPath;
          spouse.photoUrl = url;
          spouse.photoPath = path;
          p.lastEditedBy = getEditorName();
          p.lastEditedAt = new Date().toISOString();
          persist();
          logChange("added a photo for", `${spouse.name} (spouse of ${p.name})`);
          render(currentId);
          refreshRowAvatar(spouse);
          if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
        } catch (err) {
          console.warn("[Wong Family Tree] Spouse photo upload failed:", err);
          alert("Upload failed — check your connection and try again.");
        }
      });
    }
    if (removeBtn){
      removeBtn.addEventListener("click", () => {
        const spouseId = row.dataset.id;
        const p = editingId ? byId(editingId) : null;
        const spouse = p && Array.isArray(p.spouses) ? p.spouses.find(sp => sp.id === spouseId) : null;
        if (!spouse || !spouse.photoUrl) return;
        if (!confirm(`Remove ${spouse.name}'s photo?`)) return;
        const oldPath = spouse.photoPath;
        delete spouse.photoUrl;
        delete spouse.photoPath;
        p.lastEditedBy = getEditorName();
        p.lastEditedAt = new Date().toISOString();
        persist();
        logChange("removed the photo for", `${spouse.name} (spouse of ${p.name})`);
        render(currentId);
        refreshRowAvatar(spouse);
        if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
      });
    }
  }

  function renderSpouseRows(list){
    const wrap = document.getElementById("spouseList");
    const rows = (list && list.length) ? list : [{name:"",note:""}];
    wrap.innerHTML = rows.map(s => spouseRowHtml(s)).join("");
    wrap.querySelectorAll(".spouseRow").forEach(row => {
      wireSpouseRemove(row);
      wireSpousePhotoControls(row);
    });
  }

  // Reads current name/note straight off the form, but photo fields never
  // had a form control of their own -- those come from whatever's live on
  // the matching spouse in DATA right now (kept in sync by the upload/remove
  // handlers above), same "read fresh off DATA" rule the main person's photo
  // already follows in the Save handler below.
  function collectSpouseRows(existingSpouses){
    const existingById = new Map((existingSpouses || []).map(s => [s.id, s]));
    return Array.from(document.querySelectorAll("#spouseList .spouseRow")).map(row => {
      const name = row.querySelector(".sp_name").value.trim();
      const note = row.querySelector(".sp_note").value.trim();
      if (!name && !note) return null;
      const id = row.dataset.id || newSpouseId();
      const out = { id, name, note };
      const prior = existingById.get(id);
      if (prior && prior.photoUrl) { out.photoUrl = prior.photoUrl; out.photoPath = prior.photoPath; }
      return out;
    }).filter(Boolean);
  }

  document.getElementById("btnAddSpouse").addEventListener("click", () => {
    const wrap = document.getElementById("spouseList");
    wrap.insertAdjacentHTML("beforeend", spouseRowHtml({name:"",note:""}));
    const rows = wrap.querySelectorAll(".spouseRow");
    const last = rows[rows.length - 1];
    wireSpouseRemove(last);
    wireSpousePhotoControls(last);
    last.querySelector(".sp_name").focus();
  });

  // ---------- editor ----------
  function populateParentSelect(excludeId){
    const sel = document.getElementById("f_parent");
    sel.innerHTML = '<option value="">— none (root of chart) —</option>';
    DATA.slice().sort((a,b)=>a.gen-b.gen || a.name.localeCompare(b.name)).forEach(p => {
      if (p.id === excludeId) return;
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.name} (gen ${p.gen})`;
      sel.appendChild(opt);
    });
  }

  function openEditor(id){
    editingId = id;
    const isNew = !id;
    document.getElementById("editorTitle").textContent = isNew ? "Add person" : "Edit person";
    const p = isNew ? {name:"",gen:"",dates:"",parent:"",spouses:[],note:"",confidence:"clear",uncertain:false} : byId(id);
    populateParentSelect(id);
    document.getElementById("f_name").value = p.name || "";
    document.getElementById("f_gen").value = p.gen ?? "";
    document.getElementById("f_dates").value = p.dates || "";
    document.getElementById("f_parent").value = p.parent || "";
    renderSpouseRows(p.spouses || []);
    document.getElementById("f_note").value = p.note || "";
    document.getElementById("f_confidence").value = p.confidence || "clear";
    document.getElementById("f_uncertain").checked = !!p.uncertain;
    document.getElementById("btnDelete").style.display = isNew ? "none" : "block";
    document.getElementById("photoSection").style.display = isNew ? "none" : "block";
    document.getElementById("photoSectionNew").style.display = isNew ? "block" : "none";
    if (!isNew) updateEditorAvatarPreview(p);
    const meta = document.getElementById("editorMeta");
    if (!isNew && p.lastEditedBy) {
      meta.textContent = `Last updated by ${p.lastEditedBy}${p.lastEditedAt ? " · " + formatWhen(p.lastEditedAt) : ""}`;
      meta.style.display = "block";
    } else {
      meta.style.display = "none";
    }
    document.getElementById("overlay").style.display = "block";
    document.getElementById("editor").style.display = "flex";
  }

  function closeEditor(){
    document.getElementById("overlay").style.display = "none";
    document.getElementById("editor").style.display = "none";
    editingId = null;
  }

  // ---------- photo upload (editing person's own card only — see #photoSection) ----------
  function updateEditorAvatarPreview(p){
    document.getElementById("editorAvatarWrap").innerHTML = avatarHtml(p, "avatar-lg");
    document.getElementById("btnRemovePhoto").style.display = p.photoUrl ? "inline-flex" : "none";
  }
  function setPhotoStatus(msg, isError){
    const el = document.getElementById("photoStatus");
    el.textContent = msg || "";
    el.style.color = isError ? "var(--uncertain)" : "var(--sub2)";
  }
  document.getElementById("btnUploadPhoto").onclick = () => document.getElementById("photoInput").click();
  document.getElementById("photoInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || !editingId) return;
    if (!file.type.startsWith("image/")) { setPhotoStatus("Please choose an image file.", true); return; }
    if (file.size > 8 * 1024 * 1024) { setPhotoStatus("That image is over 8MB — please choose a smaller one.", true); return; }
    if (!window.__wftUploadPhoto) { setPhotoStatus("Photo upload isn't available right now — try again in a moment.", true); return; }
    const p = byId(editingId);
    if (!p) return;
    setPhotoStatus("Uploading…", false);
    try {
      const { url, path } = await window.__wftUploadPhoto(file, editingId);
      const oldPath = p.photoPath;
      p.photoUrl = url;
      p.photoPath = path;
      p.lastEditedBy = getEditorName();
      p.lastEditedAt = new Date().toISOString();
      persist();
      logChange("added a photo for", p.name);
      render(currentId);
      updateEditorAvatarPreview(p);
      setPhotoStatus("Photo updated.", false);
      if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
    } catch (err) {
      console.warn("[Wong Family Tree] Photo upload failed:", err);
      setPhotoStatus("Upload failed — check your connection and try again.", true);
    }
  });
  document.getElementById("btnRemovePhoto").onclick = () => {
    if (!editingId) return;
    const p = byId(editingId);
    if (!p || !p.photoUrl) return;
    if (!confirm(`Remove ${p.name}'s photo?`)) return;
    const oldPath = p.photoPath;
    delete p.photoUrl;
    delete p.photoPath;
    p.lastEditedBy = getEditorName();
    p.lastEditedAt = new Date().toISOString();
    persist();
    logChange("removed the photo for", p.name);
    render(currentId);
    updateEditorAvatarPreview(p);
    setPhotoStatus("Photo removed.", false);
    if (oldPath && window.__wftDeletePhoto) window.__wftDeletePhoto(oldPath);
  };

  document.getElementById("f_parent").addEventListener("change", (e) => {
    const parentId = e.target.value;
    const genField = document.getElementById("f_gen");
    if (parentId) {
      const parent = byId(parentId);
      if (parent && !genField.value) genField.value = parent.gen + 1;
      else if (parent) genField.value = parent.gen + 1;
    }
  });

  document.getElementById("btnCancel").onclick = closeEditor;
  document.getElementById("overlay").onclick = closeEditor;

  document.getElementById("btnSave").onclick = () => {
    const name = document.getElementById("f_name").value.trim();
    if (!name) { alert("Please enter a name."); return; }
    const gen = parseInt(document.getElementById("f_gen").value, 10);
    if (isNaN(gen)) { alert("Please enter a generation number."); return; }
    const wasNew = !editingId;
    // read the photo fields fresh off DATA (not off the form, which has no photo
    // fields) so a photo uploaded/removed earlier in this same editor session —
    // that flow persists immediately, independent of Save — is never lost here
    const existing = editingId ? byId(editingId) : null;
    const rec = {
      id: editingId || newId(),
      name,
      gen,
      dates: document.getElementById("f_dates").value.trim(),
      parent: document.getElementById("f_parent").value || null,
      spouses: collectSpouseRows(existing ? existing.spouses : []),
      note: document.getElementById("f_note").value.trim(),
      confidence: document.getElementById("f_confidence").value,
      uncertain: document.getElementById("f_uncertain").checked,
      lastEditedBy: getEditorName(),
      lastEditedAt: new Date().toISOString()
    };
    if (existing && existing.photoUrl) { rec.photoUrl = existing.photoUrl; rec.photoPath = existing.photoPath; }
    if (rec.parent === rec.id) { alert("A person can't be their own parent."); return; }
    if (editingId) {
      const idx = DATA.findIndex(p => p.id === editingId);
      DATA[idx] = rec;
    } else {
      DATA.push(rec);
    }
    persist();
    logChange(wasNew ? "added" : "edited", rec.name);
    render(rec.id);
    closeEditor();
  };

  document.getElementById("btnDelete").onclick = () => {
    if (!editingId) return;
    const children = DATA.filter(p => p.parent === editingId);
    if (children.length > 0) {
      const ok = confirm(`${children.length} people are linked to this person as their parent. Delete anyway and re-link them to this person's own parent?`);
      if (!ok) return;
      const rec = byId(editingId);
      children.forEach(c => c.parent = rec.parent || null);
    }
    const deletedRec = byId(editingId) || {};
    const deletedName = deletedRec.name || "someone";
    // land the view somewhere that still exists once this person is gone
    const fallbackId = deletedRec.parent && byId(deletedRec.parent) ? deletedRec.parent : null;
    DATA = DATA.filter(p => p.id !== editingId);
    persist();
    logChange("deleted", deletedName);
    render(fallbackId);
    closeEditor();
  };

  document.getElementById("btnAdd").onclick = () => openEditor(null);

  // ---------- fullscreen ----------
  const appEl = document.getElementById("app");
  document.getElementById("btnFullscreen").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (appEl.requestFullscreen) appEl.requestFullscreen();
  };
  document.addEventListener("fullscreenchange", () => {
    document.getElementById("btnFullscreen").textContent = document.fullscreenElement ? "⤢" : "⛶";
  });

  // ---------- theme ----------
  const THEME_KEY = "wong-family-tree-theme";
  function applyTheme(t){
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    document.getElementById("btnTheme").textContent = (t === "dark") ? "☀️" : "🌙";
  }
  document.getElementById("btnTheme").onclick = () => {
    const current = document.documentElement.getAttribute("data-theme")
      || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  };
  applyTheme(localStorage.getItem(THEME_KEY));

  // ---------- live shared sync (Firebase Realtime Database) ----------
  // The module script below (loaded separately, since Firebase only ships as
  // an ES module from the CDN) fills these two slots in once it connects:
  //   __wftPushData(data)   -> write this browser's data up to the shared DB
  // and calls these two, which we define here:
  //   __wftGetCurrentData() -> hand back whatever this browser currently has,
  //                            used once to seed the DB the very first time
  //                            it's ever empty
  //   __wftOnRemoteData(d)  -> called whenever the shared DB's data changes,
  //                            including changes made by someone else
  // If the module never loads or never connects (offline, blocked network,
  // no Firebase project configured), none of this fires and the tool works
  // exactly as it always has, off localStorage + the embedded data below.
  window.__wftGetCurrentData = function(){ return DATA; };
  window.__wftOnRemoteData = function(remote){
    if (!Array.isArray(remote) || !remote.length) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(DATA)) return; // nothing actually changed
    DATA = migrateSpouses(remote);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    document.getElementById("family-data-store").textContent = JSON.stringify(DATA, null, 1);
    localStorage.setItem(BASELINE_KEY, document.getElementById("family-data-store").textContent);
    // stay put if the person we're looking at still exists after this remote
    // change; render(...) itself falls back to the root if they don't
    render(currentId);
  };
  // Same idea, one level down: the activity log syncs on its own path so
  // everyone's "who changed what" feed matches, same as the tree data does.
  window.__wftGetCurrentLog = function(){ return CHANGELOG; };
  window.__wftOnRemoteLog = function(remote){
    if (!Array.isArray(remote)) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(CHANGELOG)) return;
    CHANGELOG = remote;
    localStorage.setItem(CHANGELOG_KEY, JSON.stringify(CHANGELOG));
    renderActivityLog();
  };
  // Same idea, one level down again: the guestbook syncs on its own path too.
  window.__wftGetCurrentGuestbook = function(){ return GUESTBOOK; };
  window.__wftOnRemoteGuestbook = function(remote){
    if (!Array.isArray(remote)) return;
    const remoteText = JSON.stringify(remote);
    if (remoteText === JSON.stringify(GUESTBOOK)) return;
    GUESTBOOK = remote;
    localStorage.setItem(GUESTBOOK_KEY, JSON.stringify(GUESTBOOK));
    renderGuestbook();
  };

  // ---------- init ----------
  DATA = migrateSpouses(loadData());
  CHANGELOG = loadChangelog();
  GUESTBOOK = loadGuestbook();
  render();
  renderActivityLog();
  renderGuestbook();
})();
</script>

<script type="module">
  // ---------- Firebase Realtime Database: live multi-user sync ----------
  // This talks to a shared database so every open copy of this page (any
  // computer, any browser) sees the same family-tree data and stays in
  // sync automatically. It is entirely additive: if this fails to load or
  // connect for any reason, the page falls back to the local-only behavior
  // it always had (see the plain <script> block above).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAWiPSyvdPoU8-LH0C3j8IZY7qHn19gXuw",
    authDomain: "wong-family-tree.firebaseapp.com",
    databaseURL: "https://wong-family-tree-default-rtdb.firebaseio.com",
    projectId: "wong-family-tree",
    storageBucket: "wong-family-tree.firebasestorage.app",
    messagingSenderId: "482850066709",
    appId: "1:482850066709:web:19e189598e1173b6f5991c"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "wongFamilyTree");
    const logRef = ref(db, "wongFamilyTreeLog");
    const guestbookRef = ref(db, "wongFamilyTreeGuestbook");
    const storage = getStorage(app);

    // ---------- photo uploads (Firebase Storage) ----------
    // Anyone with the page open can upload a photo for anyone else — there's no
    // login system here, by design (most of the people in this tree can't upload
    // their own photo; a living relative uploading an old photo of an ancestor is
    // the whole point). Storage's own security rules are what actually keep this
    // to images under a sane size — see the setup notes delivered alongside this file.
    window.__wftUploadPhoto = async function(file, personId){
      const path = `photos/${personId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9_.-]/g,"_")}`;
      const r = storageRef(storage, path);
      await uploadBytes(r, file, { contentType: file.type });
      const url = await getDownloadURL(r);
      return { url, path };
    };
    window.__wftDeletePhoto = async function(path){
      // Best-effort cleanup of the previous photo when it's replaced or removed —
      // never blocks the UI and never surfaces an error if it fails.
      try { await deleteObject(storageRef(storage, path)); }
      catch (err) { console.warn("[Wong Family Tree] Could not delete old photo (leaving it in Storage):", err); }
    };

    window.__wftPushData = function(data){
      set(dataRef, data).catch(err => console.warn("[Wong Family Tree] Could not save to the shared database:", err));
    };
    window.__wftPushLog = function(log){
      set(logRef, log).catch(err => console.warn("[Wong Family Tree] Could not save the activity log:", err));
    };
    window.__wftPushGuestbook = function(entries){
      set(guestbookRef, entries).catch(err => console.warn("[Wong Family Tree] Could not save the guestbook:", err));
    };

    onValue(dataRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        // Shared database is empty (first time it's ever been used) -- seed
        // it with whatever this page currently has, so everyone else who
        // opens it from now on sees real data instead of nothing.
        if (window.__wftGetCurrentData) window.__wftPushData(window.__wftGetCurrentData());
        return;
      }
      if (window.__wftOnRemoteData) window.__wftOnRemoteData(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Live sync listener error (running in local-only mode):", err);
    });

    onValue(logRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        if (window.__wftGetCurrentLog) window.__wftPushLog(window.__wftGetCurrentLog());
        return;
      }
      if (window.__wftOnRemoteLog) window.__wftOnRemoteLog(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Activity log sync error (running in local-only mode):", err);
    });

    onValue(guestbookRef, (snapshot) => {
      const val = snapshot.val();
      if (val === null) {
        if (window.__wftGetCurrentGuestbook) window.__wftPushGuestbook(window.__wftGetCurrentGuestbook());
        return;
      }
      if (window.__wftOnRemoteGuestbook) window.__wftOnRemoteGuestbook(val);
    }, (err) => {
      console.warn("[Wong Family Tree] Guestbook sync error (running in local-only mode):", err);
    });

    console.log("[Wong Family Tree] Connected to the shared live database.");
  } catch (err) {
    console.warn("[Wong Family Tree] Live sync unavailable, running in local-only mode:", err);
  }
</script>
